<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Arcie</title>
  <!-- Google Font: Geo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geo&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0f17;--fg:#e6edf3;--muted:#9aa5b1;
      --neon-red:#ff2a55;--neon-red-soft:rgba(255,42,85,.14);
      --neon-green:#7CFF7A;--neon-green-soft:rgba(124,255,122,.12);
      --glass:rgba(255,255,255,.06);
    }
    html,body{height:100%}
    body{ margin:0; color:var(--fg); font-family:'Geo',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:radial-gradient(1200px 800px at 70% -10%,#111a29,var(--bg)); }

    .wrap{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:grid;place-items:center}

    /* Layering */
    .stack{position:relative; width:min(100vw,56.25vh); height:100vh; z-index:0;}
    .hud{position:fixed;inset:0;pointer-events:none; z-index:30}
    .center{position:fixed;inset:0;display:grid;place-items:center; z-index:20}

    /* Two-layer canvas: bg (blurred/scrolled), game (main) */
    canvas{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:16px;}
    #bg{filter:blur(8px); opacity:.22;}
    #c{box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04); background:linear-gradient(180deg,#0a0f18 0%,#05080d 100%); touch-action:none}

    .score{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06);padding:12px 22px;border-radius:12px;backdrop-filter:blur(6px);font-weight:900;letter-spacing:.4px;font-size:clamp(24px,5.8vw,44px)}

    /* HOME: no frame; global glass overlay */
    #glass{position:fixed; inset:0; z-index:10; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(14px) saturate(130%); pointer-events:none}

    .panel{pointer-events:auto; width:min(92vw,560px); border:none; background:transparent; border-radius:22px; padding:0; text-align:center; position:relative}

    /* Buttons */
    .menu{display:grid; gap:16px; margin-top:12px; width:min(92vw,520px); margin-inline:auto}
    .btn{position:relative; pointer-events:auto; padding:22px 28px; border-radius:18px; border:1px solid rgba(255,255,255,.16); background:var(--glass); color:var(--fg); font-weight:900; letter-spacing:.6px; text-transform:uppercase; font-size:20px; cursor:pointer; user-select:none; width:100%;}
    #home .btn{font-size:56px}
    .btn:active{transform:translateY(1px) scale(.98)}

    /* START: glass + animated gradient stroke (colors move, border stays) */
    @property --angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
    .btn.start{border-color:transparent;}
    .btn.start::before{ content:""; position:absolute; inset:-2px; border-radius:inherit; background:conic-gradient(from var(--angle), #ff2a55, #f6c51d, #7CFF7A, #3ecbff, #b38cff, #ff2a55); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite: exclude; padding:2px; animation: spinHue 4s linear infinite; }
    @keyframes spinHue{ to{ --angle:360deg; } }

    /* SETTINGS: glass + gray stroke */
    .btn.gray{border:1.8px solid rgba(255,255,255,.22);}

    .subtle{color:var(--muted); font-size:14px; margin-top:8px}

    /* Title 3x & light gradient sweep behind */
    #home #title{font-size:clamp(72px,12vw,160px); letter-spacing:1px}
    #home #title::after{content:""; position:absolute; left:50%; top:-120%; transform:translateX(-50%); width:140%; height:300%; background:linear-gradient(180deg, rgba(124,255,122,.0) 0%, rgba(124,255,122,.35) 35%, rgba(62,203,255,.25) 55%, rgba(179,140,255,.25) 70%, rgba(255,42,85,.0) 100%); filter:blur(18px); mix-blend-mode:screen; animation:titleBeam 6s linear infinite; pointer-events:none}
    @keyframes titleBeam { 0%{ top:-140%; } 100%{ top:30%; } }

    /* Button luminous glow */
    .btn::after{content:""; position:absolute; inset:-6px; border-radius:inherit; filter:blur(16px); opacity:.45; background:linear-gradient(90deg,#ff2a55,#f6c51d,#7CFF7A,#3ecbff,#b38cff,#ff2a55); background-size:200% 100%; z-index:-1; animation:btnFlow 5s linear infinite}
    @keyframes btnFlow{ 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

    /* Settings visuals */
    #settings h2{font-size:clamp(36px,6vw,64px)}
    .form .label, .switch span:last-child{font-size:clamp(18px,3.2vw,24px)}
    #settings .menu.actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%}
    #settings .menu.actions .btn{font-size:20px; padding:14px 16px}

    /* High score single line */
    #hiscore{white-space:nowrap}

    /* Home footer credits */
    #home .foot{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); font-size:12px; opacity:.7; text-align:center}

    /* Background: home arcs are drawn via JS on bg canvas */
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stack">
      <canvas id="bg" width="600" height="1066" aria-hidden="true"></canvas>
      <canvas id="c" width="600" height="1066" aria-label="Arcie"></canvas>
    </div>
  </div>

  <div id="glass" style="display:block"></div>

  <div class="hud"><div class="score" id="score" style="display:none">Score: 0</div></div>

  <!-- HOME -->
  <div class="center" id="home" style="display:grid">
    <div class="panel">
      <h1 id="title" style="margin:0 0 8px; position:relative">Arcie</h1>
      <div class="menu">
        <button class="btn start" id="btnStart">Start</button>
        <button class="btn gray" id="btnSettings">Settings</button>
      </div>
      <div class="subtle" id="hiscore" style="font-size:clamp(36px,6.5vw,66px); color:var(--fg); opacity:.9; margin-top:8px">High Score: 0</div>
      <div class="foot">Design & code: You + ChatGPT · Music: Procedural ambient · Typeface: Geo</div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div class="center" id="settings" style="display:none">
    <div class="panel" style="padding:28px; background:rgba(10,14,22,.4); border:1px solid rgba(255,255,255,.08); box-shadow:0 24px 60px rgba(0,0,0,.5)">
      <h2 style="margin:0 0 12px">Settings</h2>
      <div class="form" style="display:grid; gap:16px; text-align:left">
        <div class="field" style="display:grid; gap:8px">
          <div class="label" style="color:var(--muted)">Game Difficulty (Speed)</div>
          <select id="difficulty" class="select" style="appearance:none; background:rgba(5,8,13,.88); color:var(--fg); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:12px 14px; font-family:inherit; font-weight:700">
            <option value="easy">Easy</option>
            <option value="normal">Normal</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="field" style="display:grid; gap:8px">
          <input type="checkbox" id="music" />
          <label class="switch" for="music"><span class="icon on">🔊</span><span class="icon off">🔇</span><span>Background music</span></label>
        </div>
        <div class="menu actions">
          <button class="btn gray" id="btnBack">Back</button>
          <button class="btn start" id="btnApply">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div class="center" id="gameover" style="display:none">
    <div class="panel" style="padding:28px; background:rgba(10,14,22,.4); border:1px solid rgba(255,255,255,.08); box-shadow:0 24px 60px rgba(0,0,0,.5)">
      <h1>Game Over</h1>
      <p id="sum">Score: 0 • Best: 0</p>
      <div class="menu" style="width:min(82vw,360px)">
        <button class="btn start" id="again">Retry</button>
        <button class="btn gray" id="goHome">Home</button>
      </div>
    </div>
  </div>

<script>
(() => {
  // ====== Constants & DOM refs ======
  const W=600,H=1066; // logical canvas size (≈9:16)
  const c=document.getElementById('c');
  const bg=document.getElementById('bg');
  const ctx=c.getContext('2d');
  const bctx=bg.getContext('2d');
  const glass=document.getElementById('glass');
  const home=document.getElementById('home');
  const settings=document.getElementById('settings');
  const over=document.getElementById('gameover');
  const btnStart=document.getElementById('btnStart');
  const btnSettings=document.getElementById('btnSettings');
  const btnBack=document.getElementById('btnBack');
  const btnApply=document.getElementById('btnApply');
  const goHome=document.getElementById('goHome');
  const startBtn=document.getElementById('again');
  const scoreEl=document.getElementById('score');
  const sumEl=document.getElementById('sum');
  const hiscoreEl=document.getElementById('hiscore');
  const selDiff=document.getElementById('difficulty');
  const chkMusic=document.getElementById('music');

  // CSS → Canvas colors
  const CSS = getComputedStyle(document.documentElement);
  const COLORS = {
    neonRedSoft: CSS.getPropertyValue('--neon-red-soft').trim() || 'rgba(255,42,85,.14)',
    neonRed: CSS.getPropertyValue('--neon-red').trim() || '#ff2a55',
    neonGreenSoft: CSS.getPropertyValue('--neon-green-soft').trim() || 'rgba(124,255,122,.12)',
    neonGreen: CSS.getPropertyValue('--neon-green').trim() || '#7CFF7A',
  };

  // ====== State ======
  let camY=0; // game camera
  let scene='home'; // 'home' | 'settings' | 'play' | 'over'

  // Energy (fade-to-lose)
  let energy=1;                        // 1..0 → brightness level
  const ENERGY_DECAY=1/10;             // per second (10s to zero)

  // Ripples (tap effect)
  const ripples=[]; // {x,y,t}

  // Home background arcs (wanderers)
  const hArcs=[]; const HARC_N=10;
  function initHomeArc(a){
    a.x = Math.random()*W; a.y = Math.random()*H;
    a.dir = Math.random()<0.5?-1:+1;
    a.radius = 60 + Math.random()*160;
    a.speed = 60 + Math.random()*120;
    a.hueOff = Math.random()*360;
    a.heading = -Math.PI/2 + (Math.random()-0.5);
    const nx = -Math.sin(a.heading)*a.dir, ny = Math.cos(a.heading)*a.dir;
    a.cx = a.x + nx*a.radius; a.cy = a.y + ny*a.radius;
    a.ang = Math.atan2(a.y-a.cy, a.x-a.cx);
    a.trail = []; a.arcTarget = (Math.PI/4) + Math.random()* (Math.PI*0.8); a.traveled = 0;
  }
  function seedBackground(){ hArcs.length=0; for(let i=0;i<HARC_N;i++){ const a={}; initHomeArc(a); hArcs.push(a);} }
  function updateHomeArcs(dt){ for(const a of hArcs){ const w=a.speed/a.radius; const dAng = w*dt*a.dir; a.ang += dAng; a.x = a.cx + Math.cos(a.ang)*a.radius; a.y = a.cy + Math.sin(a.ang)*a.radius; a.heading = a.ang + (a.dir>0? Math.PI/2 : -Math.PI/2); a.traveled += Math.abs(dAng);
      if(a.trail.length===0 || Math.hypot(a.x-(a.trail.at(-1)?.x||0), a.y-(a.trail.at(-1)?.y||0))>2){ a.trail.push({x:a.x, y:a.y}); if(a.trail.length>140) a.trail.shift(); }
      if(a.traveled > a.arcTarget){ a.dir = (Math.random()<0.5? -a.dir: a.dir); a.radius = 60 + Math.random()*160; const nx=-Math.sin(a.heading)*a.dir, ny=Math.cos(a.heading)*a.dir; a.cx = a.x + nx*a.radius; a.cy = a.y + ny*a.radius; a.ang = Math.atan2(a.y-a.cy, a.x-a.cx); a.traveled = 0; a.arcTarget=(Math.PI/4)+Math.random()* (Math.PI*0.8); }
      // gentle wrap
      if(a.x<-30) a.x=W+30; if(a.x>W+30) a.x=-30; if(a.y<-30) a.y=H+30; if(a.y>H+30) a.y=-30; } }
  function drawHomeArcTrails(time){ bctx.save(); bctx.globalCompositeOperation='lighter'; for(const a of hArcs){ const n=a.trail.length; if(n<2) continue; for(let i=1;i<n;i++){ const p0=a.trail[i-1], p1=a.trail[i]; const t=i/(n-1); const alpha=t*0.5; const w=1 + t*3; const hue=(time*40 + i*3 + a.hueOff)%360; const grad=bctx.createLinearGradient(p0.x,p0.y,p1.x,p1.y); grad.addColorStop(0,`hsla(${hue},100%,65%,${alpha*0.35})`); grad.addColorStop(1,`hsla(${(hue+40)%360},100%,65%,${alpha*0.35})`); bctx.strokeStyle=grad; bctx.lineWidth=w; bctx.beginPath(); bctx.moveTo(p0.x,p0.y); bctx.lineTo(p1.x,p1.y); bctx.stroke(); } } bctx.restore(); }

  // ====== Player ======
  const player={
    x: W/2,
    y: H-40,
    r: 15,
    dir: 0,
    speedBase: 220,
    speed: 220,
    heading: -Math.PI/2,
    radius: 120,
    cx: 0, cy: 0,
    ang: 0
  };

  // ====== World objects ======
  const trail=[]; // {x,y}
  const walls={left: 24, right: W-24};
  const obstacles=[]; // {x,y,r, orbitR?, omega?, t?, _ox?, _oy?}
  const bonuses=[];   // {x,y,r}
  let nextSpawnY;
  let lastBonusY; // ensure regular green lights

  // ====== Score / Settings ======
  let running=false, started=false, best=Number(localStorage.getItem('arc_best')||0);
  let score=0, maxAscend=0; // score: +1 per 200px climbed
  const settingsStore = {
    difficulty: localStorage.getItem('arc_diff')||'normal',
    music: localStorage.getItem('arc_music')==='1'
  };
  selDiff.value = settingsStore.difficulty;
  chkMusic.checked = settingsStore.music;
  applyDifficulty(settingsStore.difficulty);
  hiscoreEl.textContent = 'High Score: ' + best;

  // ====== Audio (procedural ambient) ======
  const Music = (()=>{
    let ctx=null, gain=null, oscs=[]; let enabled=false;
    function ensureCtx(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); gain=ctx.createGain(); gain.gain.value=0.05; gain.connect(ctx.destination);} return ctx; }
    function start(){ if(!enabled) return; const ac=ensureCtx(); if(ac.state==='suspended') ac.resume(); stop();
      const now=ac.currentTime;
      const freqs=[196, 261.63, 329.63]; // G, C, E (Cmaj-ish)
      freqs.forEach((f,i)=>{ const o=ac.createOscillator(); o.type=['sine','triangle','sawtooth'][i%3]; const g=ac.createGain(); g.gain.value=0.02 + i*0.01; o.frequency.value=f; o.connect(g).connect(gain); o.start(now); oscs.push(o); });
    }
    function stop(){ oscs.forEach(o=>{try{o.stop();}catch{}}); oscs=[]; }
    return { setEnabled(v){ enabled=!!v; if(!enabled){ stop(); } }, onGameStart(){ if(enabled) start(); }, onGameOver(){ stop(); }, };
  })();
  Music.setEnabled(settingsStore.music);

  // ====== Helpers ======
  function worldToScreenY(y){return y - camY;}
  function screenToWorldY(y){return y + camY;}
  // Map tap Y → radius. Bottom: 5% height diameter → r=2.5%H. Top: 20% diameter → r=10%H.
  function mapRadius(clickScreenY){ const rMin=H*0.025, rMax=H*0.10; const t = 1 - (clickScreenY/ H); return rMin + (rMax-rMin)*t; }
  function baseScoreFromY(y){ return Math.max(0, Math.floor((-y)/200)); }
  function normalFromHeading(sign){ const nx = -Math.sin(player.heading) * sign; const ny =  Math.cos(player.heading) * sign; return {nx, ny}; }
  function beginArc(sign, radius){ player.dir=sign; player.radius=radius; const {nx,ny}=normalFromHeading(sign); player.cx=player.x+nx*radius; player.cy=player.y+ny*radius; player.ang=Math.atan2(player.y-player.cy, player.x-player.cx); }
  function decayEnergy(dt){ energy = Math.max(0, energy - dt*ENERGY_DECAY); }
  function resetToStart(){ player.x=W/2; player.y=H-40; player.heading=-Math.PI/2; player.dir=0; started=false; running=false; camY=0; trail.length=0; obstacles.length=0; bonuses.length=0; nextSpawnY=player.y-500; lastBonusY=player.y; score=0; maxAscend=0; energy=1; ripples.length=0; seedBackground(); }
  function applyDifficulty(level){ let mult=1; if(level==='easy') mult=0.85; else if(level==='hard') mult=1.25; else mult=1.0; player.speed = player.speedBase * mult; }

  resetToStart();

  function explode(){ running=false; started=false; scene='over'; Music.onGameOver(); best=Math.max(best, Math.floor(score)); localStorage.setItem('arc_best', String(best)); sumEl.textContent = `Score: ${Math.floor(score)} • Best: ${best}`; hiscoreEl.textContent='High Score: '+best; over.style.display='grid'; updateHUDVisibility(); }

  function spawnWorldAhead(){
    while (nextSpawnY > player.y - 2200) {
      const laneL = walls.left + 40;
      const laneR = walls.right - 40;
      const x = Math.random()*(laneR - laneL) + laneL;
      const gap = 280 + Math.random()*260; // less clutter
      const needBonus = (lastBonusY - nextSpawnY) > 600; // guarantee a green every ~600px

      if (needBonus || Math.random() < (score < 100 ? 0.35 : 0.55)) {
        const r = 10 + Math.random()*8;
        bonuses.push({x, y: nextSpawnY, r});
        lastBonusY = nextSpawnY;
      } else {
        const r = 14 + Math.random()*18;
        if (score >= 120 && Math.random() < 0.5) {
          const orbitR = 18 + Math.random()*26; const omega = (Math.random()<.5?-1:1) * (0.6 + Math.random()*1.2);
          obstacles.push({x, y: nextSpawnY, r, orbitR, omega, t:Math.random()*Math.PI*2});
        } else {
          obstacles.push({x, y: nextSpawnY, r});
        }
      }
      nextSpawnY -= gap;
    }
  }

  function step(dt){
    if(!running) return;
    // motion along arc
    const w = player.speed / player.radius;
    player.ang += w * dt * player.dir;
    player.x = player.cx + Math.cos(player.ang)*player.radius;
    player.y = player.cy + Math.sin(player.ang)*player.radius;
    player.heading = player.ang + (player.dir>0? Math.PI/2 : -Math.PI/2);

    // energy drains; if out, lose
    decayEnergy(dt);
    if(energy<=0){ explode(); return; }

    // trail keep + trim to avoid memory bloat
    if(trail.length===0 || (Math.hypot(player.x-trail.at(-1).x, player.y-trail.at(-1).y)>2)){
      trail.push({x:player.x, y:player.y}); if(trail.length>600) trail.shift(); }

    // ripples age (1s life)
    for(let i=ripples.length-1;i>=0;i--){ if(performance.now()/1000 - ripples[i].t > 1){ ripples.splice(i,1);} }

    // camera follows to midline
    const pyScreen = worldToScreenY(player.y);
    const target = H*0.5;
    if(pyScreen < target){ camY -= (target - pyScreen); }

    // continuous distance score
    maxAscend = Math.max(maxAscend, -player.y);
    score = Math.floor(maxAscend/200);

    spawnWorldAhead();

    // animate moving obstacles
    for (const ob of obstacles){ if(ob.omega){ ob.t += ob.omega*dt; ob._ox = ob.x + Math.cos(ob.t)*ob.orbitR; ob._oy = ob.y + Math.sin(ob.t)*ob.orbitR; } else { ob._ox = ob.x; ob._oy = ob.y; } }

    // wall collision
    if(player.x - player.r < walls.left || player.x + player.r > walls.right){ explode(); }

    // obstacle collision (circle-circle)
    for (const ob of obstacles){ const ox=(ob._ox ?? ob.x), oy=(ob._oy ?? ob.y); const dx=player.x-ox, dy=player.y-oy; const rr=(player.r+ob.r)*(player.r+ob.r); if (dx*dx+dy*dy < rr){ explode(); return; } }

    // bonus pickup (restores energy to full, no score)
    for (let i=bonuses.length-1;i>=0;i--){ const b=bonuses[i]; const dx=player.x-b.x, dy=player.y-b.y; const rr=(player.r+b.r)*(player.r+b.r); if (dx*dx+dy*dy < rr){ bonuses.splice(i,1); energy=1; lastBonusY = Math.max(lastBonusY, b.y); } }
  }

  // Grid (both axes), 1px, 30% opacity
  function drawGrid(ctx2d, offsetY, alpha=0.3, grid=56){ ctx2d.save(); ctx2d.globalAlpha=alpha; ctx2d.strokeStyle='#ffffff'; ctx2d.lineWidth=1; let y=((offsetY%grid)+grid)%grid; for(; y<H; y+=grid){ ctx2d.beginPath(); ctx2d.moveTo(0,y); ctx2d.lineTo(W,y); ctx2d.stroke(); } for(let x=0; x<W; x+=grid){ ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,H); ctx2d.stroke(); } ctx2d.restore(); }
  function drawWalls(){ const wallW = 14; ctx.save(); ctx.fillStyle = COLORS.neonRedSoft; ctx.fillRect(0,0,walls.left,H); ctx.fillRect(walls.right,0,W-walls.right,H); ctx.fillStyle = COLORS.neonRed; ctx.fillRect(walls.left-wallW,0,wallW, H); ctx.fillRect(walls.right,0,wallW, H); ctx.restore(); }

  // Trail: start opaque → fade; width from wide→thin
  function drawTrail(time){ if(trail.length<2) return; ctx.save(); ctx.globalCompositeOperation='lighter'; const maxW = 7, minW = 1.5; for(let i=1;i<trail.length;i++){ const a=trail[i-1], b=trail[i]; const ax=a.x, ay=worldToScreenY(a.y); const bx=b.x, by=worldToScreenY(b.y); const t = i/(trail.length-1); const alpha = Math.pow(t,1.2); const w = minW + (maxW-minW)*t; const hueA = ((time*120)+i*2)%360; const hueB = ((time*120)+(i+1)*2)%360; const grad = ctx.createLinearGradient(ax,ay,bx,by); grad.addColorStop(0, `hsla(${hueA}, 100%, 65%, ${alpha})`); grad.addColorStop(1, `hsla(${hueB}, 100%, 65%, ${alpha})`); ctx.strokeStyle = grad; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); } ctx.restore(); }

  function drawPlayer(){ const px=player.x, py=worldToScreenY(player.y); // glow
    const glow=ctx.createRadialGradient(px,py,player.r,px,py,player.r+12); glow.addColorStop(0,`rgba(124,255,122,${0.5*energy})`); glow.addColorStop(1,'rgba(124,255,122,0)'); ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(px,py,player.r+12,0,Math.PI*2); ctx.fill(); // core
    ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(px,py,player.r,0,Math.PI*2); ctx.fill(); // ring stroke as outward-fading gradient
    const ri = player.r-1, ro = player.r+7; const ring=ctx.createRadialGradient(px,py,ri,px,py,ro); ring.addColorStop(0,`rgba(124,255,122,${0.9*energy})`); ring.addColorStop(1,'rgba(124,255,122,0)'); ctx.strokeStyle=ring; ctx.lineWidth=ro-ri; ctx.beginPath(); ctx.arc(px,py,player.r,0,Math.PI*2); ctx.stroke(); }

  function drawRipples(){ const t=performance.now()/1000; for(const r of ripples){ const age=t - r.t; const life=1; if(age<0||age>life) continue; const k=age/life; const rr=20 + k*90; const a=1-k; ctx.save(); ctx.strokeStyle=`rgba(124,255,122,${a*0.6})`; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(r.x, worldToScreenY(r.y), rr, 0, Math.PI*2); ctx.stroke(); ctx.restore(); } }

  function draw(){ const t=performance.now()/1000; const dt=Math.min(.033,(t-(draw._last||t))); draw._last=t; // Background
    bctx.clearRect(0,0,W,H);
    if(scene==='home' || scene==='settings'){ updateHomeArcs(dt); drawHomeArcTrails(t); }
    drawGrid(bctx, (t*40), 0.3, 56);

    ctx.clearRect(0,0,W,H); drawGrid(ctx, camY, 0.3, 56);
    if(scene==='play' || scene==='over'){
      drawWalls();
      for(const ob of obstacles){ const sx=(ob._ox ?? ob.x); const sy=worldToScreenY(ob._oy ?? ob.y); if(sy<-60||sy>H+60) continue; const g=ctx.createRadialGradient(sx,sy,2,sx,sy,ob.r+10); g.addColorStop(0,'rgba(255,42,85,.9)'); g.addColorStop(1,'rgba(255,42,85,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,ob.r+10,0,Math.PI*2); ctx.fill(); ctx.fillStyle=COLORS.neonRed; ctx.beginPath(); ctx.arc(sx,sy,ob.r,0,Math.PI*2); ctx.fill(); }
      for(const b of bonuses){ const sy=worldToScreenY(b.y); if(sy<-60||sy>H+60) continue; const g=ctx.createRadialGradient(b.x,sy,2,b.x,sy,b.r+12); g.addColorStop(0,'rgba(124,255,122,.85)'); g.addColorStop(1,'rgba(124,255,122,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,sy,b.r+12,0,Math.PI*2); ctx.fill(); ctx.fillStyle=COLORS.neonGreen; ctx.beginPath(); ctx.arc(b.x,sy,b.r,0,Math.PI*2); ctx.fill(); }
      drawTrail(t); drawPlayer(); drawRipples();
    }
    scoreEl.textContent = 'Score: ' + Math.floor(score);
  }

  function updateHUDVisibility(){ scoreEl.style.display = (scene==='play'||scene==='over') ? 'block':'none'; glass.style.display = (scene==='home'||scene==='settings') ? 'block':'none'; }

  let last=0; function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0); last=ts; if(scene==='play' && running) step(dt); draw(); requestAnimationFrame(loop);} requestAnimationFrame(loop);

  // ====== Input ======
  function handleTap(ev){ const rect=c.getBoundingClientRect(); let sy=(ev.touches?ev.touches[0].clientY:ev.clientY)-rect.top; let sx=(ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left; // scale from CSS px → canvas units
    const scaleX=W/rect.width, scaleY=H/rect.height; sx*=scaleX; sy*=scaleY; const radius=mapRadius(sy);
    if(scene==='play'){
      ripples.push({x:sx, y:screenToWorldY(sy), t:performance.now()/1000});
      if(!started){ const sign=Math.random()<0.5?-1:+1; beginArc(sign, radius); started=true; running=true; hideAllOverlays(); over.style.display='none'; trail.length=0; trail.push({x:player.x,y:player.y}); obstacles.length=0; bonuses.length=0; nextSpawnY=player.y-500; lastBonusY=player.y; score=0; maxAscend=0; camY=0; energy=1; Music.onGameStart(); }
      else if(running){ beginArc(-player.dir, radius); }
    }
  }

  c.addEventListener('pointerdown', (e)=>{ handleTap(e); });
  // Prevent scroll on touch
  c.addEventListener('touchmove', (e)=>e.preventDefault(), {passive:false});

  // ====== UI Nav ======
  function hideAllOverlays(){ home.style.display='none'; settings.style.display='none'; over.style.display='none'; updateHUDVisibility(); }
  btnStart.addEventListener('click', ()=>{ scene='play'; resetToStart(); hideAllOverlays(); started=false; running=false; score=0; maxAscend=0; energy=1; updateHUDVisibility(); Music.onGameStart(); });
  btnSettings.addEventListener('click', ()=>{ scene='settings'; hideAllOverlays(); settings.style.display='grid'; updateHUDVisibility(); });
  btnBack.addEventListener('click', ()=>{ scene='home'; hideAllOverlays(); home.style.display='grid'; updateHUDVisibility(); });
  btnApply.addEventListener('click', ()=>{ const wasMusic=settingsStore.music; settingsStore.difficulty=selDiff.value; settingsStore.music=chkMusic.checked; localStorage.setItem('arc_diff', settingsStore.difficulty); localStorage.setItem('arc_music', settingsStore.music?'1':'0'); applyDifficulty(settingsStore.difficulty); Music.setEnabled(settingsStore.music); if(scene==='settings'){ scene='home'; hideAllOverlays(); home.style.display='grid'; updateHUDVisibility(); } if(settingsStore.music && !wasMusic){ Music.onGameStart(); }});
  goHome.addEventListener('click', ()=>{ scene='home'; hideAllOverlays(); home.style.display='grid'; updateHUDVisibility(); });
  startBtn.addEventListener('click', ()=>{ scene='play'; over.style.display='none'; resetToStart(); updateHUDVisibility(); });

  // ====== Self-tests (console) ======
  (function runSelfTests(){
    const approx=(a,b,eps=1e-6)=>Math.abs(a-b)<=eps;
    console.groupCollapsed('%cSelf-tests','color:#7CFF7A;font-weight:bold');
    try{
      // 1) mapRadius (top 10%H, bottom 2.5%H)
      console.assert(approx(mapRadius(0), H*0.10), 'mapRadius(top) ≈ 0.10H');
      console.assert(approx(mapRadius(H), H*0.025), 'mapRadius(bottom) ≈ 0.025H');
      const mid=mapRadius(H/2); console.assert(mid < H*0.10 && mid > H*0.025, 'mapRadius(mid) within range');
      const nearTop = mapRadius(10), nearBot = mapRadius(H-10); console.assert(nearTop > nearBot, 'mapRadius monotonic');

      // 2) baseScoreFromY (200 px = 1 point)
      console.assert(baseScoreFromY(0)===0, 'score at start 0');
      console.assert(baseScoreFromY(-199)===0, '199px → 0');
      console.assert(baseScoreFromY(-200)===1, '200px → 1');
      console.assert(baseScoreFromY(-400)===2, '400px → 2');

      // 3) beginArc radius side & value
      const backup={...player};
      beginArc(+1, 100); let d=Math.hypot(player.x-player.cx, player.y-player.cy); console.assert(approx(d,100),'beginArc radius +1');
      beginArc(-1, 80); d=Math.hypot(player.x-player.cx, player.y-player.cy); console.assert(approx(d,80),'beginArc radius -1');
      Object.assign(player, backup);

      // 4) difficulty mapping
      applyDifficulty('easy');  const e1=player.speed; applyDifficulty('normal'); const n1=player.speed; applyDifficulty('hard'); const h1=player.speed;
      console.assert(e1 < n1 && n1 < h1, 'easy < normal < hard speeds');

      // 5) spawn creates things within bounds
      const beforeO=obstacles.length, beforeB=bonuses.length; nextSpawnY=player.y-500; spawnWorldAhead();
      console.assert((obstacles.length>beforeO)||(bonuses.length>beforeB), 'spawn produced');
      for(const ob of obstacles){ console.assert(ob.x>walls.left && ob.x<walls.right, 'obstacle within walls'); }

      // 6) world/screen round-trip
      const oldCam=camY; camY=500; const y=123; console.assert(approx(worldToScreenY(screenToWorldY(y)), y), 'world/screen invertible'); camY=oldCam;

      // 7) energy decay math (10s → zero)
      energy=1; decayEnergy(5); console.assert(Math.abs(energy-0.5)<0.02, 'energy ~ 0.5 after 5s');
      decayEnergy(5); console.assert(energy===0, 'energy clamps at 0 after 10s');

      // 8) ripple life <= 1s
      ripples.length=0; ripples.push({x:10,y:10,t:performance.now()/1000-1.1}); step(0); console.assert(ripples.length===0, 'old ripple culled');

      // 9) bonus sets energy to full (not partial)
      resetToStart(); energy=0.2; bonuses.push({x:player.x,y:player.y,r:12}); step(0.016); console.assert(energy===1, 'bonus should set energy to full');

      // 10) moving obstacles appear after score>=120 (force randomness)
      const rand=Math.random; Math.random=()=>0.4; score=130; nextSpawnY=player.y-500; const oBefore=obstacles.length; spawnWorldAhead(); Math.random=rand; const hasMoving = obstacles.slice(oBefore).some(o=>o.omega); console.assert(hasMoving, 'moving obstacle spawned after score>=120');

    }catch(e){ console.error('Self-test error', e); }
    console.groupEnd();
  })();
})();
</script>
