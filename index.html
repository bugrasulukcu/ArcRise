  <script>
    // Davet linklerindeki ?ref= ve #hash korunur. ?v=<timestamp> ile arcrise.html

    // (ve eski reset/skor durumu) takılı kalmaz. index.html'in kendi cache'i
    // (~10 dk) dışında stale HTML servis edilmez.
    var q = location.search ? location.search + '&' : '?';
    location.replace('./arcrise.html' + q + 'v=' + Date.now() + location.hash);
  </script>
