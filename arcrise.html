<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ArcRise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #7CFF7A;
      --red:   #ff3355;
      --bg:    #080a0e;
      --panel: rgba(10,13,22,0.92);
      --font:  'Press Start 2P', monospace;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: var(--font); color: #fff; }

    /* ── Canvas layer ── */
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .stack {
      position: relative;
      width: min(100vw, 56.25vh);
      height: 100vh;
    }
    canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    #bg  { z-index: 0; }
    #gc  { z-index: 1; touch-action: none; cursor: pointer; }

    /* ── Overlays ── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      font-family: var(--font);
    }
    .screen.active { display: flex; }

    /* ── HUD ── */
    /* #hud artık .stack içinde — position: absolute ile canvas'a göre konumlanır */
    #hud {
      position: absolute; inset: 0;
      z-index: 15; pointer-events: none;
      display: none;
    }
    #hud.active { display: block; }

    /* Duvar iç kenarı: canvas 600px'de 20px sol/sağ → %3.33
       Güvenli bölge başlangıcı = calc(3.4% + 10px)                */
    .hud-tl {
      position: absolute; top: 18px;
      left: calc(3.4% + 12px);
    }
    .hud-tr {
      position: absolute; top: 18px;
      right: calc(3.4% + 12px);
      text-align: right;
    }
    .hud-lbl { font-size: 7px; color: var(--green); letter-spacing: 1px; margin-bottom: 6px; }
    .hud-num { font-size: 13px; letter-spacing: 1px; }
    /* Küçük avatar renk noktası YOUR BEST yanında */
    #hud-av { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }

    /* Leaderboard sidebar — sağ duvarın içinde */
    #lb {
      position: absolute; top: 0;
      right: calc(3.4% + 10px);
      width: 108px; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; gap: 5px;
      padding: 60px 0 20px 0;
      overflow: hidden;
    }
    .lb-row   { font-size: 5.5px; color: rgba(255,255,255,.28); text-align: right; white-space: nowrap; }
    .lb-row.you { font-size: 6px; }

    /* ══════════ PROFILE (Settings içinde) ══════════ */
    .profile-sect {
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 18px;
    }
    .profile-lbl { font-size: 6.5px; color: var(--green); letter-spacing: 2px; margin-bottom: 12px; }
    .av-picker { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .av-opt {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      flex-shrink: 0;
    }
    .av-opt.sel { border-color: #fff; transform: scale(1.18); }
    .name-row { display: flex; gap: 8px; align-items: center; }
    #name-input {
      flex: 1; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      color: #fff; font-family: var(--font); font-size: 8px;
      letter-spacing: 2px; padding: 10px 12px;
      text-transform: uppercase; min-width: 0;
    }
    #name-input:focus { outline: none; border-color: var(--green); }
    #name-save {
      padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--green); background: rgba(124,255,122,.1);
      color: var(--green); font-family: var(--font);
      font-size: 7px; letter-spacing: 1px; cursor: pointer; flex-shrink: 0;
    }
    #name-save:active { transform: scale(0.95); }

    /* ══════════ HOME ══════════ */
    #home { gap: 0; }
    #title {
      font-size: clamp(34px, 9vw, 52px);
      letter-spacing: 3px;
      text-align: center;
      position: relative;
    }

    /* rainbow border wrapper */
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    .rb-wrap {
      padding: 2.5px; border-radius: 16px;
      background: conic-gradient(from var(--a), #ff2255,#ff7700,#ffe000,#7CFF7A,#00ccff,#8844ff,#ff2255);
      animation: spinA 3s linear infinite;
      cursor: pointer;
    }
    @keyframes spinA { to { --a: 360deg; } }
    .rb-inner {
      background: rgba(22,26,38,0.96);
      border-radius: 13px;
      padding: 17px 28px;
      font-family: var(--font);
      font-size: 20px; letter-spacing: 3px;
      color: #fff; text-align: center;
      user-select: none;
    }
    .rb-inner:active { transform: scale(0.97); }

    .menu { display: flex; flex-direction: column; gap: 14px; width: min(88vw, 310px); margin-top: 30px; }

    .btn-gray {
      padding: 14px 24px; border-radius: 13px;
      border: 1.5px solid rgba(255,255,255,.22);
      background: rgba(18,22,32,.85);
      color: #fff; font-family: var(--font);
      font-size: 13px; letter-spacing: 2px;
      cursor: pointer; width: 100%;
    }
    .btn-gray:active { transform: scale(0.97); }

    #home-best {
      font-size: 8px; letter-spacing: 1px; margin-top: 20px;
      color: var(--green); text-align: center;
    }
    #home-best span { color: #fff; }

    #credits {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 6.5px; color: rgba(255,255,255,.3); letter-spacing: 1px;
    }

    /* ══════════ SETTINGS ══════════ */
    #settings .panel {
      background: rgba(10,13,22,0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 26px;
      padding: 28px 24px 22px;
      width: min(92vw, 350px);
      display: flex; flex-direction: column; gap: 20px;
    }
    #settings h2 { font-size: 16px; text-align: center; letter-spacing: 3px; margin-bottom: 2px; }

    .srow { display: flex; align-items: center; gap: 12px; }
    .sicon {
      width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.55);
    }
    .sicon svg { width: 20px; height: 20px; }
    .slbl  { font-size: 9px; color: rgba(255,255,255,.7); letter-spacing: 1px; flex: 1; }
    .sctl  { display: flex; align-items: center; }

    /* Difficulty < NORMAL > */
    .darr {
      background: none; border: none;
      color: var(--green); font-family: var(--font);
      font-size: 14px; cursor: pointer; padding: 6px 8px;
      opacity: .85; transition: opacity .15s;
    }
    .darr:hover { opacity: 1; }
    .dval {
      font-size: 8px; letter-spacing: 1px; color: #fff;
      min-width: 76px; text-align: center;
      background: rgba(0,200,180,.15);
      border: 1px solid rgba(0,220,190,.3);
      border-radius: 10px; padding: 8px 12px;
    }

    /* Rainbow slider — tam yükseklik, yuvarlak uçlar */
    .rslide-wrap {
      position: relative; height: 14px; border-radius: 7px;
      background: linear-gradient(to right,#ff2255,#ff7700,#ffe000,#7CFF7A,#00ccff,#8844ff,#ff2255);
      box-shadow: 0 0 12px rgba(124,255,122,.15);
    }
    .rslide-wrap input[type=range] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; margin: 0;
    }
    .rslide-thumb {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 4px; height: 22px; background: #fff;
      border-radius: 3px; pointer-events: none;
      box-shadow: 0 2px 8px rgba(0,0,0,.7);
    }

    /* On/Off toggle */
    .tog {
      display: flex; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
    }
    .tog-btn {
      font-family: var(--font); font-size: 7px; letter-spacing: 1px;
      padding: 9px 14px; cursor: pointer; border: none; transition: background .18s, color .18s;
    }
    .tog-btn.active-on  { background: var(--green); color: #000; border-radius: 9px; }
    .tog-btn.active-off { background: transparent; color: rgba(255,255,255,.35); }

    /* ══════════ GAME OVER ══════════ */
    #gameover .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 26px 22px 22px;
      width: min(90vw, 330px);
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .rtable { width: 100%; border-collapse: collapse; }
    .rtable th { font-size: 6.5px; color: var(--green); letter-spacing: 1px; padding-bottom: 8px; text-align: left; }
    .rtable th:last-child { text-align: right; }
    .rtable td { font-size: 6.5px; color: rgba(255,255,255,.55); padding: 4px 0; }
    .rtable td:last-child { text-align: right; }
    .rtable tr.you td { color: #fff; }
    #go-best { font-size: 7.5px; color: var(--green); letter-spacing: 1px; text-align: center; }
    #go-best span { color: #fff; }

    /* ══════════ TUTORIAL ══════════ */
    #tutorial { pointer-events: none; }
    #touch-ring {
      position: fixed;
      width: 110px; height: 110px;
      border: 2px dashed rgba(255,255,255,.65);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; letter-spacing: 1px; color: rgba(255,255,255,.8);
      font-family: var(--font);
      animation: tpulse 1.6s ease-in-out infinite;
    }
    @keyframes tpulse {
      0%,100% { transform: scale(1); opacity: .7; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    /* ══════════ IN-GAME TUTORIAL HUD ══════════ */
    /* Alt banner: adım başlığı + açıklama + skip */
    #tut-hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 25; pointer-events: none;
      display: none;
    }
    #tut-hud.active { display: block; }
    #tut-banner {
      background: rgba(8,10,14,0.92);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
      padding: 14px 20px 18px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; pointer-events: auto;
    }
    #tut-banner-left { flex: 1; }
    #tut-banner-title {
      font-size: 9px; letter-spacing: 2px; color: var(--green);
      margin-bottom: 7px;
    }
    #tut-banner-desc {
      font-size: 6.5px; color: rgba(255,255,255,.5);
      letter-spacing: 1px; line-height: 1.8;
    }
    #tut-banner-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    #tut-step-dots { display: flex; gap: 5px; }
    .tut-sdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.18); transition: background .25s;
    }
    .tut-sdot.active { background: var(--green); }
    #tut-skip-btn {
      background: none; border: 1px solid rgba(255,255,255,.18);
      border-radius: 7px; color: rgba(255,255,255,.4);
      font-family: var(--font); font-size: 6px;
      letter-spacing: 1px; padding: 6px 11px; cursor: pointer;
    }
    #tut-skip-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* ── HOME alt bağlantıları ── */
    #home-links {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 24px; align-items: center;
    }
    .home-link {
      font-size: 6.5px; color: rgba(255,255,255,.3);
      letter-spacing: 1px; cursor: pointer; background: none;
      border: none; font-family: var(--font);
    }
    .home-link:hover { color: rgba(255,255,255,.6); }

    /* ══════════ PROFILE SETUP (ilk açılış) ══════════ */
    #profile-setup .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 28px 22px 24px;
      width: min(92vw, 360px);
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    #profile-setup h2 { font-size: 14px; letter-spacing: 2px; text-align: center; }
    #profile-setup .ps-sub { font-size: 6px; color: rgba(255,255,255,.35); letter-spacing: 1px; text-align: center; }
    #av-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; width: 100%;
    }
    .av-img-opt {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      background-size: cover; background-position: center;
      overflow: hidden;
    }
    .av-img-opt img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .av-img-opt.sel { border-color: #fff; transform: scale(1.12); }
    #ps-name-row { display: flex; gap: 8px; width: 100%; align-items: center; }
    #ps-name-input {
      flex: 1; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      color: #fff; font-family: var(--font); font-size: 9px;
      letter-spacing: 2px; padding: 12px 14px;
      text-transform: uppercase; min-width: 0; text-align: center;
    }
    #ps-name-input:focus { outline: none; border-color: var(--green); }
    #ps-confirm {
      width: 100%; padding: 15px; border-radius: 13px;
      border: 1.5px solid var(--green); background: rgba(124,255,122,.12);
      color: var(--green); font-family: var(--font);
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
    }
    #ps-confirm:active { transform: scale(0.97); }

    /* Difficulty selector kaldırıldı — tek seviye: EXTREME */

    /* ══════════ SETTINGS profile (read-only) ══════════ */
    #settings-profile-ro {
      display: flex; align-items: center; gap: 14px;
      padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.08);
      cursor: pointer;
    }
    #settings-av-img {
      width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden; border: 2px solid rgba(255,255,255,.25);
      transition: border-color .2s, transform .18s;
      position: relative;
    }
    #settings-av-img:hover { border-color: var(--green); transform: scale(1.07); }
    #settings-av-img img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    #settings-av-badge {
      position: absolute; bottom: 0; right: 0;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--green); border: 2px solid #080a0e;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; color: #000;
    }
    #settings-name-lbl { font-size: 10px; letter-spacing: 2px; }

    /* ══════════ AVATAR MODAL ══════════ */
    #av-modal {
      position: fixed; inset: 0; z-index: 50;
      display: none; align-items: center; justify-content: center;
      background: rgba(4,6,12,0.82);
      backdrop-filter: blur(12px);
    }
    #av-modal.open { display: flex; }
    #av-modal-box {
      background: rgba(12,16,26,0.96);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      padding: 26px 22px 22px;
      width: min(92vw, 360px);
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    #av-modal-title { font-size: 12px; letter-spacing: 2px; color: #fff; }
    #av-modal-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 10px; width: 100%;
    }
    .av-modal-opt {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .15s, transform .15s;
      overflow: hidden;
    }
    .av-modal-opt img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .av-modal-opt.sel { border-color: #fff; transform: scale(1.1); }
    #av-modal-close {
      width: 100%; padding: 13px; border-radius: 13px;
      border: 1.5px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.7); font-family: var(--font);
      font-size: 10px; letter-spacing: 2px; cursor: pointer;
    }
    #av-modal-close:active { transform: scale(0.97); }

    /* av-picker in settings — image thumbnails */
    .av-opt {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      flex-shrink: 0; overflow: hidden;
    }
    .av-opt img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .av-opt.sel { border-color: #fff; transform: scale(1.18); }

    /* ── RESET butonu (Settings'te) ── */
    .btn-danger {
      padding: 12px 24px; border-radius: 13px;
      border: 1.5px solid rgba(255,51,85,.45);
      background: rgba(255,51,85,.08);
      color: #ff3355; font-family: var(--font);
      font-size: 8px; letter-spacing: 1px;
      cursor: pointer; width: 100%;
    }
    .btn-danger:active { transform: scale(0.97); }

    /* Onay baloncuğu */
    #reset-confirm {
      display: none; font-size: 7px; color: rgba(255,255,255,.5);
      letter-spacing: 1px; text-align: center; margin-top: -10px;
    }

    /* ══════════ HOME PROFILE CARD ══════════ */
    #home-profile {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 18px;
      padding: 12px 18px 12px 14px;
      width: min(88vw, 310px);
      margin-top: 22px;
    }
    #home-av-wrap {
      position: relative; flex-shrink: 0;
      width: 52px; height: 52px;
    }
    #home-av-wrap::before {
      content: '';
      position: absolute; inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from var(--a,0deg),#ff2255,#ff7700,#ffe000,#7CFF7A,#00ccff,#8844ff,#ff2255);
      animation: spinA 3s linear infinite;
      z-index: 0;
    }
    #home-av-wrap::after {
      content: '';
      position: absolute; inset: 1px;
      border-radius: 50%;
      background: var(--bg);
      z-index: 1;
    }
    #home-av-img {
      position: absolute; inset: 3px;
      border-radius: 50%; z-index: 2;
      width: calc(100% - 6px); height: calc(100% - 6px);
      object-fit: cover;
    }
    #home-profile-info { flex: 1; min-width: 0; }
    #home-pname {
      font-size: 11px; letter-spacing: 2px;
      color: #fff; margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #home-pbest-row {
      display: flex; align-items: center; gap: 6px;
    }
    #home-pbest-lbl { font-size: 6px; color: var(--green); letter-spacing: 1px; }
    #home-pbest-val { font-size: 10px; color: #fff; letter-spacing: 1px; }

    /* ══════════ DIFFICULTY COLORS ══════════ */
    #hd-label { transition: color .25s, border-color .25s, background .25s; }

    /* ══════════ BOOSTER HUD ══════════ */
    #booster-hud {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 16; pointer-events: none;
      display: none;
    }
    #booster-hud.active { display: block; }
    #booster-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(10,6,24,0.85);
      border: 1px solid rgba(180,80,255,.5);
      border-radius: 20px;
      padding: 6px 14px 6px 10px;
      backdrop-filter: blur(8px);
    }
    #booster-icon { font-size: 14px; }
    #booster-name { font-size: 7px; letter-spacing: 1px; color: #cc88ff; }
    #booster-bar-wrap {
      width: 48px; height: 4px; background: rgba(255,255,255,.12);
      border-radius: 2px; overflow: hidden;
    }
    #booster-bar {
      height: 100%; background: #cc88ff; border-radius: 2px;
      transition: width .1s linear;
    }
  </style>
</head>
<body>

<!-- ── Canvas + HUD (aynı stack içinde, duvar sınırlarına göre konumlanır) ── -->
<div id="wrap">
  <div class="stack">
    <canvas id="bg"></canvas>
    <canvas id="gc"></canvas>
    <div id="hud">
      <div class="hud-tl">
        <div class="hud-lbl">SCORE</div>
        <div class="hud-num" id="h-score">000</div>
      </div>
      <div class="hud-tr">
        <div class="hud-lbl">YOUR BEST <span id="hud-av"></span></div>
        <div class="hud-num" id="h-best">000</div>
      </div>
      <div id="lb"></div>
      <!-- Booster indicator -->
      <div id="booster-hud">
        <div id="booster-pill">
          <span id="booster-icon">⚡</span>
          <span id="booster-name">BOOST</span>
          <div id="booster-bar-wrap"><div id="booster-bar" style="width:100%"></div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ PROFILE SETUP ══ -->
<div class="screen" id="profile-setup">
  <div class="panel">
    <h2>CREATE PROFILE</h2>
    <div class="ps-sub">Your name cannot be changed later.</div>
    <div id="av-grid"></div>
    <div id="ps-name-row">

  ══════════════════════════════════════════════════════════

<script>
// ── Firebase Firestore (REST API — SDK gerekmez) ────────────
// Config'i console.firebase.google.com > Project Settings > Web app'ten al
const FIREBASE_CONFIG = {
  apiKey:    'AIzaSyB7x2es8UgEkQ91K4hruM7OaJKhpXkzvW4',
  projectId: 'arcrise-e1504',
};

const ARC_DB = (() => {
  const { apiKey, projectId } = FIREBASE_CONFIG;
  const BASE = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`;

  // Skor kaydet — her oyuncu için sadece en yüksek skor tutulur
  async function submitScore(name, avatar, score) {
    if (!projectId || projectId.startsWith('BURAYA')) return;
    try {
      // Mevcut doc'u bul
      const qRes = await fetch(`${BASE}:runQuery?key=${apiKey}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ structuredQuery: {
          from: [{ collectionId: 'scores' }],
          where: { fieldFilter: { field: { fieldPath: 'name' }, op: 'EQUAL', value: { stringValue: name } } },
          limit: 1,
        }}),
      });
      const hits = (await qRes.json()).filter(r => r.document?.fields);

      if (hits.length > 0) {
        const oldScore = parseInt(hits[0].document.fields.score.integerValue ?? 0);
        if (score <= oldScore) return; // eski skor daha iyi, atla
        // PATCH: sadece score, avatar ve ts güncelle
        const docId = hits[0].document.name.split('/').pop();
        await fetch(
          `${BASE}/scores/${docId}?key=${apiKey}&updateMask.fieldPaths=score&updateMask.fieldPaths=avatar&updateMask.fieldPaths=ts`,
          {
            method: 'PATCH', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fields: {
              score:  { integerValue: String(score)  },
              avatar: { integerValue: String(avatar) },
              ts:     { integerValue: String(Date.now()) },
            }}),
          }
        );
      } else {
        // Yeni kayıt
        await fetch(`${BASE}/scores?key=${apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: {
            name:   { stringValue: name  },
            avatar: { integerValue: String(avatar) },
            score:  { integerValue: String(score)  },
            ts:     { integerValue: String(Date.now()) },
          }}),
        });
      }
    } catch(e) { console.warn('[ArcDB] submit failed', e); }
  }

  // Top-N skor çek
  async function getTopScores(n = 10) {
    if (!projectId || projectId.startsWith('BURAYA')) return [];
    try {
      const res = await fetch(`${BASE}:runQuery?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ structuredQuery: {
          from:    [{ collectionId: 'scores' }],
          orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }],
          limit:   n,
        }}),
      });
      const rows = await res.json();
      return rows
        .filter(r => r.document?.fields)
        .map(r => ({
          name:   r.document.fields.name.stringValue,
          avatar: parseInt(r.document.fields.avatar.integerValue ?? 3),
          score:  parseInt(r.document.fields.score.integerValue ?? 0),
        }));
    } catch(e) { console.warn('[ArcDB] fetch failed', e); return []; }
  }

  return { submitScore, getTopScores };
})();

  // ── BG Arc animation ─────────────────────────────────────
  const RAINBOW = ['#ff2255','#ff6600','#ddcc00','#7CFF7A','#00b8ff','#7744ff','#ff44aa'];
  const bgArcs  = [];

  // Her BG arc: bir "top" dairesel yay üzerinde hareket eder, arkasında iz bırakır.
  // Tıpkı oyundaki topun yaptığı gibi — gerçek dairesel kinematik.
  function newBgArc(preAge) {
    const hueStart = Math.random() * 360;              // gökkuşağı başlangıç rengi
    const radius = 90 + Math.random() * 220;
    const cx     = (Math.random() * 0.85 + 0.075) * W;
    const cy     = (Math.random() * 0.85 + 0.075) * H;
    const startA = Math.random() * Math.PI * 2;
    const dir    = Math.random() < 0.5 ? 1 : -1;
    const speed  = 110 + Math.random() * 140;
    const omega  = dir * speed / radius;
    const maxLen = Math.PI * (0.6 + Math.random() * 1.1);
    const drawT  = maxLen / Math.abs(omega);
    const FADE_OUT = 1.8;
    const age    = preAge ?? 0;
    return { cx, cy, radius, startA, dir, omega, maxLen, drawT, hueStart, age, FADE_OUT };
  }

  function initBgArcs() {
    bgArcs.length = 0;
    // Aralarına dağıtılmış preAge ile başlatılsın ki hepsi aynı anda başlamasın
    for (let i = 0; i < 8; i++) bgArcs.push(newBgArc(Math.random() * 4.5));
  }

  function tickBgArcs(dt) {
    for (let i = bgArcs.length - 1; i >= 0; i--) {
      const a = bgArcs[i];
      a.age += dt;
      if (a.age >= a.drawT + a.FADE_OUT) { bgArcs.splice(i, 1); bgArcs.push(newBgArc()); }
    }
    while (bgArcs.length < 8) bgArcs.push(newBgArc());
  }

  function drawBgArcs(ctx2) {
    const SEGS  = 20; // gökkuşağı segmenti sayısı
    const FADE_IN = 0.35;
    ctx2.save();
    ctx2.lineWidth = 1.6;
    ctx2.lineCap   = 'round';

    for (const a of bgArcs) {
      // Çizim fazı: ne kadar radyan çizildi (0..maxLen)
      const headFrac = Math.min(1, a.age / a.drawT); // 0→1 çizim ilerler
      // Silme fazı: çizim bitti → kuyruk ilerler
      const tailFrac = a.age > a.drawT
        ? Math.min(1, (a.age - a.drawT) / a.FADE_OUT)
        : 0;
      if (tailFrac >= 1) continue;

      // Genel opaklık: fade-in sırasında açılır
      const alpha = Math.min(1, a.age / FADE_IN) * 0.6;

      for (let s = 0; s < SEGS; s++) {
        // Her segmentin [t0, t1] aralığı toplam uzunluk içinde (0..1)
        const t0 = tailFrac + (headFrac - tailFrac) * (s / SEGS);
        const t1 = tailFrac + (headFrac - tailFrac) * ((s + 1) / SEGS);
        if (t1 <= t0) continue;

        // Segmentin açıları
        const ang0 = a.startA + a.dir * a.maxLen * t0;
        const ang1 = a.startA + a.dir * a.maxLen * t1;

        // Gökkuşağı rengi — baş tarafa doğru daha parlak
        const segT   = s / (SEGS - 1);
        const hue    = (a.hueStart + segT * 280) % 360;
        const bright = 55 + segT * 12;
        // Kuyruk segmentleri daha soluk
        const segA   = alpha * (0.25 + segT * 0.75);

        ctx2.globalAlpha = segA;
        ctx2.strokeStyle = `hsl(${hue},100%,${bright}%)`;

        ctx2.beginPath();
        if (a.dir > 0) ctx2.arc(a.cx, a.cy, a.radius, ang0, ang1, false);
        else            ctx2.arc(a.cx, a.cy, a.radius, ang1, ang0, false);
        ctx2.stroke();
      }
    }
    ctx2.restore();
  }

  // ── Grid ─────────────────────────────────────────────────
  function drawGrid(ctx2, oy = 0, alpha = 0.13, sz = 40) {
    ctx2.save();
    ctx2.globalAlpha  = alpha;
    ctx2.strokeStyle  = '#fff';
    ctx2.lineWidth    = 0.5;
    const off = ((oy % sz) + sz) % sz;
    for (let y = off; y < H; y += sz) { ctx2.beginPath(); ctx2.moveTo(0,y); ctx2.lineTo(W,y); ctx2.stroke(); }
    for (let x = 0;   x < W; x += sz) { ctx2.beginPath(); ctx2.moveTo(x,0); ctx2.lineTo(x,H); ctx2.stroke(); }
    ctx2.restore();
  }

  // ── Walls ────────────────────────────────────────────────
  const walls = { left: 20, right: W - 20 };
  function drawWalls() {
    ctx.save();
    ctx.fillStyle = 'rgba(255,51,85,.09)';
    ctx.fillRect(0, 0, walls.left, H);
    ctx.fillRect(walls.right, 0, W - walls.right, H);
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(walls.left - 10, 0, 10, H);
    ctx.fillRect(walls.right,     0, 10, H);
    ctx.restore();
  }

  // ── Obstacles ────────────────────────────────────────────
  function drawObstacles() {
    ctx.save();
    // Duvarın dışına taşan kısmı kırp — siyah duvar görünsün
    ctx.beginPath();
    ctx.rect(walls.left, 0, walls.right - walls.left, H);
    ctx.clip();
    for (const ob of obstacles) {
      const sx = ob._ox ?? ob.x, sy = W2S(ob._oy ?? ob.y);
      if (sy < -100 || sy > H + 100) continue;
      ctx.fillStyle = '#ff3355';
      ctx.beginPath(); ctx.arc(sx, sy, ob.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // ── Bonuses ──────────────────────────────────────────────
  function drawBonuses() {
    for (const b of bonuses) {
      const sy = W2S(b.y);
      if (sy < -100 || sy > H + 100) continue;
      let g = ctx.createRadialGradient(b.x, sy, 0, b.x, sy, b.r * 2.8);
      g.addColorStop(0, 'rgba(124,255,122,.9)'); g.addColorStop(1, 'rgba(60,255,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, sy, b.r * 2.8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7CFF7A'; ctx.beginPath(); ctx.arc(b.x, sy, b.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── Gold Balls ───────────────────────────────────────────
  function drawGoldBalls() {
    const now = performance.now() / 1000;
    for (const b of goldBalls) {
      const sy = W2S(b.y);
      if (sy < -80 || sy > H + 80) continue;
      ctx.save();
      // Büyük glow (görünür olmaları için r çok küçük, glow geniş tutulur)
      const glowR = Math.max(12, b.r * 9);
      const pulse = 0.8 + 0.2 * Math.sin(now * 5 + b.x);
      let g = ctx.createRadialGradient(b.x, sy, 0, b.x, sy, glowR);
      g.addColorStop(0,   `rgba(255,220,0,${.9 * pulse})`);
      g.addColorStop(0.35,`rgba(255,180,0,${.5 * pulse})`);
      g.addColorStop(1,   'rgba(255,140,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x, sy, glowR, 0, Math.PI*2); ctx.fill();
      // Minik core (r=1..2 px)
      ctx.fillStyle = '#FFE44D';
      ctx.beginPath(); ctx.arc(b.x, sy, b.r, 0, Math.PI*2); ctx.fill();
      // Puan (+100 / +50) — glowun üzerinde küçük yazı
      ctx.fillStyle = 'rgba(255,240,120,0.9)';
      ctx.font = `6px 'Press Start 2P', monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText('+' + b.pts, b.x, sy - glowR * 0.55);
      ctx.restore();
    }
  }

  // ── Purple Boosters ──────────────────────────────────────
  const PURPLE_ICONS = { wide:'↔', narrow:'↕', magnet:'🎯', x2:'×2', x3:'×3', x4:'×4',
                         ghost:'👻', shield:'🛡', speed:'⚡' };
  function drawPurpleBalls() {
    const now = performance.now() / 1000;
    for (const b of purpleBalls) {
      const sy = W2S(b.y);
      if (sy < -80 || sy > H + 80) continue;
      const pulse = 0.85 + 0.15 * Math.sin(now * 4);
      ctx.save();
      // Mor glow
      let g = ctx.createRadialGradient(b.x, sy, 0, b.x, sy, b.r * 3);
      g.addColorStop(0, `rgba(180,80,255,${.85 * pulse})`);
      g.addColorStop(1, 'rgba(100,0,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, sy, b.r * 3, 0, Math.PI*2); ctx.fill();
      // Core
      ctx.fillStyle = '#b450ff';
      ctx.beginPath(); ctx.arc(b.x, sy, b.r, 0, Math.PI*2); ctx.fill();
      // Icon
      ctx.font = `${b.r * 0.9}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(PURPLE_ICONS[b.type] ?? '?', b.x, sy);
      ctx.restore();
    }

  // ── Green Particles ──────────────────────────────────────
  function spawnGreenParticles(wx, wy) {
    const count = 24;
    for (let i = 0; i < count; i++) {
      const ang  = (i / count) * Math.PI * 2 + Math.random() * 0.5;
      const spd  = 120 + Math.random() * 220;
      particles.push({
        wx, wy,
        x: wx, y: wy,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 5 + Math.random() * 9,      // r=5..14 (çok daha büyük)
        life: 1,
        hue: 110 + Math.random() * 40,
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.vx *= Math.pow(0.84, dt * 60);
      p.vy *= Math.pow(0.84, dt * 60);
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      p.life -= dt * 1.4;              // ~0.7s ömür
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter'; // parlak blend
    for (const p of particles) {
      const sy = W2S(p.y);
      if (sy < -40 || sy > H + 40) continue;
      const a  = Math.max(0, p.life);
      // Glow halkası
      const gR = p.r * 2.2;
      const g  = ctx.createRadialGradient(p.x, sy, 0, p.x, sy, gR);
      g.addColorStop(0,   `hsla(${p.hue},100%,72%,${a * 0.9})`);
      g.addColorStop(0.5, `hsla(${p.hue},100%,60%,${a * 0.4})`);
      g.addColorStop(1,   `hsla(${p.hue},100%,50%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, sy, gR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ── Ghost Trail (önceki oyun, %20 opaklık) ───────────────
  function drawGhostTrail() {
    if (ghostTrail.length < 2) return;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.lineWidth   = 2;
    ctx.lineCap     = 'round';
    for (let i = 1; i < ghostTrail.length; i++) {
      const a = ghostTrail[i-1], b = ghostTrail[i];
      const ay = W2S(a.y), by = W2S(b.y);
      if (Math.max(ay, by) < -80 || Math.min(ay, by) > H + 80) continue;
      ctx.strokeStyle = `hsl(${a.h},100%,65%)`;
      ctx.beginPath();
      ctx.moveTo(a.x, ay);
      ctx.lineTo(b.x, by);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── Trail ────────────────────────────────────────────────
  function drawTrail(time) {
    if (trail.length < 2) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i-1], b = trail[i];
      const t = i / (trail.length - 1);
      const al = Math.pow(t, 1.4) * 0.9;
      const w  = 1 + t * 3.8;
      const h1 = ((time * 80) + i * 3) % 360;
      const h2 = (h1 + 35) % 360;
      const gr = ctx.createLinearGradient(a.x, W2S(a.y), b.x, W2S(b.y));
      gr.addColorStop(0, `hsla(${h1},100%,65%,${al})`);
      gr.addColorStop(1, `hsla(${h2},100%,65%,${al})`);
      ctx.strokeStyle = gr; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, W2S(a.y)); ctx.lineTo(b.x, W2S(b.y)); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Player ───────────────────────────────────────────────
  function drawPlayer() {
    ctx.save();
    const px = player.x, py = W2S(player.y), r = player.r;

    // Renk: geri sayım değerine göre (9→green, 4→yellow, 1→red)
    const countdown = Math.ceil(energy * 9);
    let glowR, glowG, glowB;
    if (countdown > 5)      { glowR = 124; glowG = 255; glowB = 122; }       // yeşil
    else if (countdown > 3) { glowR = 255; glowG = 220; glowB = 60; }         // sarı
    else if (countdown > 1) { glowR = 255; glowG = 140; glowB = 60; }         // turuncu
    else                    { glowR = 255; glowG = 60;  glowB = 60; }          // kırmızı

    // Ghost efekti — mor renk, yarı saydam
    if (isGhost) { glowR = 160; glowG = 80; glowB = 255; }

    const glowCol = `rgb(${glowR},${glowG},${glowB})`;
    const glowA   = isGhost ? 0.5 : 1;

    // Büyük glow (r*4.5)
    let g = ctx.createRadialGradient(px, py, 0, px, py, r * 4.5);
    g.addColorStop(0,   `rgba(${glowR},${glowG},${glowB},${.65 * energy * glowA})`);
    g.addColorStop(0.4, `rgba(${glowR},${glowG},${glowB},${.30 * energy * glowA})`);
    g.addColorStop(0.75,`rgba(${glowR},${glowG},${glowB},${.10 * energy * glowA})`);
    g.addColorStop(1,   `rgba(${glowR},${glowG},${glowB},0)`);
    ctx.globalAlpha = isGhost ? 0.65 : 1;
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 4.5, 0, Math.PI*2); ctx.fill();

    // Siyah gövde
    ctx.fillStyle = isGhost ? 'rgba(40,0,80,0.7)' : '#000';
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();

    // Ring stroke — glow rengiyle aynı renk
    ctx.strokeStyle = `rgba(${glowR},${glowG},${glowB},${.95 * energy})`;
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.stroke();

    // Geri sayım — %50 daha büyük font
    const countCol = `rgba(${glowR},${glowG},${glowB},0.95)`;
    ctx.fillStyle = countCol;
    ctx.globalAlpha = isGhost ? 0.65 : 1;
    ctx.font = `${r < 20 ? 11 : 14}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(countdown), px, py);
    ctx.restore();
  }

  // ── Ripples ──────────────────────────────────────────────
  function drawRipples() {
    const now = performance.now() / 1000;
    for (const rp of ripples) {
      const age = now - rp.t; if (age > 1) continue;
      ctx.save();
      ctx.strokeStyle = `rgba(124,255,122,${(1-age)*.45})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(rp.x, W2S(rp.y), 20 + age * 80, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // ── Booster Border ───────────────────────────────────────
  function drawBoosterBorder() {
    if (!boosterType || boosterDur <= 0) return;
    const frac  = Math.max(0, boosterTime / boosterDur);
    if (frac < 0.01) return;
    const maxLW = 22;
    const lw    = maxLW * frac;
    const info  = BOOSTER_INFO[boosterType];
    const color = info?.color ?? '#b450ff';
    // pulse hızlı son 20%'de
    const now   = performance.now() / 1000;
    const pulse = frac < 0.2 ? 0.5 + 0.5 * Math.abs(Math.sin(now * 8)) : 1;
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth   = lw;
    ctx.globalAlpha = (0.45 + 0.45 * frac) * pulse;
    ctx.strokeRect(lw / 2, lw / 2, W - lw, H - lw);
    ctx.restore();
  }

  // ── Leaderboard ──────────────────────────────────────────
  const LB_NAMES = ['ALEXXX','BYTE','NEXUS','STORM','VOID','ECHO','PULSE','ORBIT','FLUX','NOVA','ZERO','SIGMA'];
  let lbFrame = 0;

  // Firestore'dan canlı skorları çek, lbNPCScores'u doldur
  async function fetchLiveScores() {
    try {
      const rows = await ARC_DB.getTopScores(20);
      if (rows && rows.length > 0) {
        // Oyuncunun kendi satırını dışarıda bırak; refreshLB dinamik ekleyecek
        lbNPCScores = rows
          .filter(r => r.name !== playerName)
          .map(r => ({ n: r.name, s: r.score }));
      } else {
        // Firebase boş / ulaşılamadı → sahte NPC'ler
        lbNPCScores = LB_NAMES.map(n => ({ n, s: 2 + Math.floor(Math.random() * 18) }));
        lbNPCScores.sort((a, b) => b.s - a.s);
      }
    } catch (e) {
      lbNPCScores = LB_NAMES.map(n => ({ n, s: 2 + Math.floor(Math.random() * 18) }));
      lbNPCScores.sort((a, b) => b.s - a.s);
    }
  }

  function refreshLB() {
    lbFrame++;
    if (lbFrame % 30 !== 0) return; // update every 30 frames
    const sc  = Math.floor(score);
    const avc = AVATAR_COLORS[avatarIdx];
    // NPC'leri ve oyuncuyu birleştir, skora göre sırala
    const rows = [...lbNPCScores, { n: playerName, s: sc, you: true }];
    rows.sort((a, b) => b.s - a.s);
    // Oyuncunun sırası
    const youIdx = rows.findIndex(r => r.you);
    // Oyuncu ortada kalacak şekilde 12 satır dilim
    const start = Math.max(0, youIdx - 5);
    const slice = rows.slice(start, start + 13);
    lbEl.innerHTML = slice.map(r =>
      r.you
        ? `<div class="lb-row you" style="color:${avc}">▶ ${r.n}</div>`
        : `<div class="lb-row">${r.n}</div>`
    ).join('');
  }

  // ── World helpers ─────────────────────────────────────────
  const W2S = y => y - camY;
  const S2W = y => y + camY;

  function beginArc(sign, radius) {
    player.dir = sign; player.radius = radius;
    const nx = -Math.sin(player.heading) * sign;
    const ny =  Math.cos(player.heading) * sign;
    player.cx = player.x + nx * radius;
    player.cy = player.y + ny * radius;
    player.ang = Math.atan2(player.y - player.cy, player.x - player.cx);
  }

  // ── Tutorial çizim sistemi ────────────────────────────────
  function dashedRing(x, y, r, color, dash = [9, 6]) {
    ctx.save();
    ctx.setLineDash(dash);
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.8;
    ctx.globalAlpha = tutAlpha;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function tutLabel(cx, cy, line1, line2, col1 = '#fff', col2 = '#fff') {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(line1, cx + 1, cy + 1);
    if (line2) ctx.fillText(line2, cx + 1, cy + 17);
    ctx.fillStyle = col1;
    ctx.fillText(line1, cx, cy);
    if (line2) { ctx.fillStyle = col2; ctx.fillText(line2, cx, cy + 17); }
    ctx.restore();
  }

  // "FROM THE RED" → "FROM " normal + "THE RED" kırmızı
  function tutLabelMixed(cx, cy, line1, prefix, highlight, col1 = '#fff') {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    ctx.fillStyle = col1;
    ctx.fillText(line1, cx, cy);
    // measure prefix + highlight widths
    const fullW  = ctx.measureText(prefix + highlight).width;
    const preW   = ctx.measureText(prefix).width;
    const startX = cx - fullW / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(prefix, startX, cy + 17);
    ctx.fillStyle = '#ff3355';
    ctx.fillText(highlight, startX + preW, cy + 17);
    ctx.restore();
  }

  // "COLLECT GREEN / TO MOVE" → "COLLECT " normal + "GREEN" yeşil
  function tutLabelGreen(cx, cy) {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    const l1 = 'COLLECT GREEN';
    const fullW = ctx.measureText(l1).width;
    const preW  = ctx.measureText('COLLECT ').width;
    const sx    = cx - fullW / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText('COLLECT ', sx, cy);
    ctx.fillStyle = '#7CFF7A'; ctx.fillText('GREEN', sx + preW, cy);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('TO MOVE', cx, cy + 17);
    ctx.restore();
  }

  function drawTutorial(time) {
    if (tutStep < 0 || tutStep > 4) return;

    // fade in/out (0→1 in 0.4s, stays, 1→0 in last 0.4s for timed steps)
    tutAlpha = Math.min(1, tutAlpha);

    const pulse = 0.75 + 0.25 * Math.sin(time * 3.5); // pulsing ring

    if (tutStep === 0) {
      // ── Adım 0: TOUCH ──────────────────────────────────────
      const rx = W * 0.72, ry = H * 0.72;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([9, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 56, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx, ry, 'TOUCH', null, '#fff');

    } else if (tutStep === 1) {
      // ── Adım 1: COLLECT GREEN TO MOVE ──────────────────────
      // Ekranda görünen ilk bonus etrafında yeşil dashed ring
      const b = bonuses.find(bo => { const sy = W2S(bo.y); return sy > 60 && sy < H - 60; });
      if (b) {
        const sy = W2S(b.y);
        dashedRing(b.x, sy, b.r + 22, `rgba(124,255,122,${pulse * .85})`);
        tutLabelGreen(b.x, sy - b.r - 46);
      }

    } else if (tutStep === 2) {
      // ── Adım 2: STAY AWAY FROM THE RED ─────────────────────
      // Ekranda görünen ilk engel etrafında kırmızı dashed ring
      const ob = obstacles.find(o => { const sy = W2S(o._oy ?? o.y); return sy > 60 && sy < H - 60; });
      if (ob) {
        const sx = ob._ox ?? ob.x, sy = W2S(ob._oy ?? ob.y);
        ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
        ctx.setLineDash([9, 6]);
        ctx.strokeStyle = `rgba(255,51,85,.85)`; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(sx, sy, ob.r + 22, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        tutLabelMixed(sx, sy - ob.r - 46, 'STAY AWAY', 'FROM ', 'THE RED');
      }

    } else if (tutStep === 3) {
      // ── Adım 3: TOUCH RIGHT → WIDE ARC ──────────────────────
      const rx = W * 0.82, ry = H * 0.42;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([10, 7]);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 68, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx - 90, ry, 'TOUCH RIGHT', 'WIDE ARC');

    } else if (tutStep === 4) {
      // ── Adım 4: TOUCH LEFT → TIGHT ARC ─────────────────────
      const rx = W * 0.18, ry = H * 0.42;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([10, 7]);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 52, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx + 80, ry, 'TOUCH LEFT', 'TIGHT ARC');
    }
  }

  function advanceTut(nextStep) {
    tutStep  = nextStep;
    tutTimer = 0;
    tutAlpha = 0; // sıfırdan fade-in
    updateTutHud();
  }

  function endTutorial() {
    tutStep = -1;
    tutHudEl.classList.remove('active');
  }

  function resetGame() {
    player.x = W/2; player.y = H - 200;
    player.heading = -Math.PI/2; player.dir = 0;
    player.speed = GAME_SPEED;
    camY = 0; trail.length = 0; obstacles.length = 0; bonuses.length = 0; ripples.length = 0;
    nextSpawnY = player.y - 500; lastBonusY = player.y;
    score = 0; maxAscend = 0; energy = 1; scoreBonus = 0;
    started = false; running = false; lbFrame = 0;
    tutStep = -1; tutTimer = 0; tutAlpha = 0; tutPaused = false;
    goldBalls.length = 0; purpleBalls.length = 0; particles.length = 0;
    clearBooster();
    // Firestore'dan gerçek skorları arka planda çek
    fetchLiveScores();
    initBgArcs();
  }

  function spawnAhead() {
    while (nextSpawnY > player.y - 2200) {
      const sc = score;
      const x  = walls.left + 55 + Math.random() * (walls.right - walls.left - 110);

      // Gap azalıyor
      let gMin, gMax;
      if      (sc < 50)  { gMin = 280; gMax = 430; }
      else if (sc < 120) { gMin = 240; gMax = 370; }
      else if (sc < 250) { gMin = 200; gMax = 320; }
      else if (sc < 450) { gMin = 170; gMax = 280; }
      else               { gMin = 150; gMax = 250; }
      const gap = gMin + Math.random() * (gMax - gMin);

      const needBonus = (lastBonusY - nextSpawnY) > 540;
      // Altın top: %12 şans (sc >= 20'den sonra)
      const spawnGold   = sc >= 20  && Math.random() < 0.12;
      // Mor booster: %8 şans (sc >= 50'den sonra)
      const spawnPurple = sc >= 50  && Math.random() < 0.08;

      if (needBonus || Math.random() < (sc < 80 ? .36 : .52)) {
        bonuses.push({ x, y: nextSpawnY, r: 11 + Math.random() * 7 });
        lastBonusY = nextSpawnY;
        // Altın veya mor topu yeşilin yakınına ekle (farklı x)
        if (spawnGold) {
          const gx = walls.left + 55 + Math.random() * (walls.right - walls.left - 110);
          // r=1..2 (minik), en küçük=100 puan, en büyük=50 puan
          const gr = 1 + Math.random(); // r=1..2
          goldBalls.push({ x: gx, y: nextSpawnY - 80 - Math.random() * 60, r: gr,
            pts: Math.round(100 / gr) }); // r=1→100, r=2→50
        }
        if (spawnPurple && !spawnGold) {
          const px2 = walls.left + 55 + Math.random() * (walls.right - walls.left - 110);
          const PURPLE_TYPES = ['wide','narrow','magnet','x2','x3','x4','ghost','shield','speed'];
          const ptype = PURPLE_TYPES[Math.floor(Math.random() * PURPLE_TYPES.length)];
          purpleBalls.push({ x: px2, y: nextSpawnY - 80 - Math.random() * 60, r: 12, type: ptype });
        }
      } else {
        // Engel boyutu: min çap=W/10 (r=30), max çap=W/3 (r=100)
        let rMin, rMax;
        if      (sc < 50)  { rMin = 30; rMax = 50; }
        else if (sc < 120) { rMin = 38; rMax = 62; }
        else if (sc < 250) { rMin = 45; rMax = 75; }
        else if (sc < 450) { rMin = 55; rMax = 88; }
        else               { rMin = 65; rMax = 100; }
        const r = rMin + Math.random() * (rMax - rMin);

        const ob = { x, y: nextSpawnY, r };

        // Hareket sistemi (250 puan üstü)
        if (sc >= 250) {
          const tier = Math.floor((sc - 250) / 250) + 1; // her 250 puan +1
          ob.ma  = tier * 0.1 * 2 * r;           // genlik: çapın %10'u × tier
          ob.mf  = 0.6 + Math.random() * 0.8;    // frekans (rad/s)
          ob.mt  = Math.random() * Math.PI * 2;   // faz ofseti

          if (sc >= 1000) {
            ob.mk    = 'rand';
            ob.mang  = Math.random() * Math.PI * 2;
            ob.mnext = 1.5 + Math.random() * 2;
            ob.mct   = 0;
          } else if (sc >= 500) {
            ob.mk   = 'diag';
            ob.mang = Math.random() * Math.PI * 2;
          } else {
            ob.mk = Math.random() < 0.5 ? 'h' : 'v';
          }
        }

        obstacles.push(ob);
      }
      nextSpawnY -= gap;
    }
  }

  function step(dt) {
    if (!running || tutPaused) return;
    const w  = player.speed / player.radius;
    player.ang += w * dt * player.dir;
    player.x    = player.cx + Math.cos(player.ang) * player.radius;
    player.y    = player.cy + Math.sin(player.ang) * player.radius;
    player.heading = player.ang + (player.dir > 0 ? Math.PI/2 : -Math.PI/2);

    energy = Math.max(0, energy - dt * ENERGY_DECAY);
    if (energy <= 0) { endGame(); return; }

    const now = performance.now() / 1000;

    if (!trail.length || Math.hypot(player.x - trail.at(-1).x, player.y - trail.at(-1).y) > 2) {
      const th = (now * 80 + trail.length * 3) % 360; // anlık ton rengi
      trail.push({ x: player.x, y: player.y, h: th });
      if (trail.length > 600) trail.shift();
    }

    for (let i = ripples.length - 1; i >= 0; i--) { if (now - ripples[i].t > 1) ripples.splice(i,1); }

    const pyS = W2S(player.y);
    if (pyS < H * .5) camY -= (H * .5 - pyS);

    maxAscend = Math.max(maxAscend, -player.y);
    // Booster puanı çarpanı + scoreBonus
    const scoreMulBoost = boosterType === 'x4' ? 4 : boosterType === 'x3' ? 3 : boosterType === 'x2' ? 2 : 1;
    score = Math.floor(maxAscend / 200 * SCORE_MUL * scoreMulBoost) + scoreBonus;

    // Booster sayacı
    if (boosterType && boosterDur > 0) {
      boosterTime -= dt;
      if (boosterTime <= 0) { clearBooster(); }
      else {
        BOOSTER_BAR.style.width = Math.round(boosterTime / boosterDur * 100) + '%';
      }
    }

    spawnAhead();
    updateParticles(dt);

    for (const ob of obstacles) {
      if (ob.mk) {
        ob.mt += dt;
        const s = Math.sin(ob.mt * ob.mf) * ob.ma;
        if      (ob.mk === 'h')    { ob._ox = ob.x + s;                            ob._oy = ob.y; }
        else if (ob.mk === 'v')    { ob._ox = ob.x;                                ob._oy = ob.y + s; }
        else if (ob.mk === 'diag') { ob._ox = ob.x + Math.cos(ob.mang) * s;        ob._oy = ob.y + Math.sin(ob.mang) * s; }
        else { // rand
          ob.mct += dt;
          if (ob.mct >= ob.mnext) { ob.mang = Math.random() * Math.PI * 2; ob.mnext = 1.5 + Math.random() * 2; ob.mct = 0; }
          ob._ox = ob.x + Math.cos(ob.mang) * s; ob._oy = ob.y + Math.sin(ob.mang) * s;
        }
      } else { ob._ox = ob.x; ob._oy = ob.y; }
    }

    if (!isGhost) {
      if (player.x - player.r < walls.left || player.x + player.r > walls.right) {
        if (hasShield) { clearBooster(); } else { endGame(); return; }
      }
      for (const ob of obstacles) {
        const dx = player.x - ob._ox, dy = player.y - ob._oy;
        if (dx*dx + dy*dy < (player.r + ob.r)**2) {
          if (hasShield) { clearBooster(); break; } else { endGame(); return; }
        }
      }
    }
    for (let i = bonuses.length - 1; i >= 0; i--) {
      const b = bonuses[i], dx = player.x - b.x, dy = player.y - b.y;
      if (dx*dx + dy*dy < (player.r + b.r)**2) {
        bonuses.splice(i,1); energy = 1;
        spawnGreenParticles(b.x, b.y); // ← yeşil partiküller
        if (tutStep === 1) advanceTut(2);
      }
    }
    // Altın top toplama (glow alanı kadar collision — minik core için)
    for (let i = goldBalls.length - 1; i >= 0; i--) {
      const b = goldBalls[i], dx = player.x - b.x, dy = player.y - b.y;
      const hitR = player.r + Math.max(12, b.r * 9); // glow yarıçapı kadar
      if (dx*dx + dy*dy < hitR * hitR) {
        goldBalls.splice(i, 1);
        scoreBonus += b.pts;
      }
    }
    // Mor booster toplama
    for (let i = purpleBalls.length - 1; i >= 0; i--) {
      const b = purpleBalls[i], dx = player.x - b.x, dy = player.y - b.y;
      if (dx*dx + dy*dy < (player.r + b.r)**2) {
        purpleBalls.splice(i, 1);
        activateBooster(b.type);
      }
    }

    // ── Tutorial zamanlayıcısı ──────────────────────────────
    if (tutStep >= 0 && tutStep <= 4) {
      tutTimer += dt;
      // Fade in: ilk 0.5s
      if (tutTimer < 0.5) tutAlpha = tutTimer / 0.5;
      else tutAlpha = 1;

      // Zamanlı adımlar için otomatik ilerleme
      if (tutStep === 1 && tutTimer > 3.5) advanceTut(2);
      if (tutStep === 2 && tutTimer > 3.5) advanceTut(3);
      if (tutStep === 3 && tutTimer > 5.5) advanceTut(4);
      if (tutStep === 4 && tutTimer > 5.5) { endTutorial(); }
    }
  }

  async function endGame() {
    haptic(2000); // çarpışma titreşimi — 2 saniye
    // Ghost: bu oyunun trail'ini bir sonraki oyun için sakla
    ghostTrail = trail.map(p => ({ x: p.x, y: p.y, h: p.h ?? 120 }));
    running = false; started = false;
    best = Math.max(best, Math.floor(score));
    localStorage.setItem('arc_best', String(best));

    const sc  = Math.floor(score);
    const avc = AVATAR_COLORS[avatarIdx];

    goBestV.textContent = pad(best);
    // Önce ekranı aç — Firestore cevabını beklemeden
    showScene('over');

    // Geçici "yükleniyor" satırları
    rankRows.innerHTML = `<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,.3);font-size:6px;padding:12px 0">LOADING...</td></tr>`;

    // Skoru Firestore'a gönder (config yoksa no-op)
    await ARC_DB.submitScore(playerName, avatarIdx, sc);

    // Yeterli satır çek (player sıralamayı bulmak için)
    const topRows = await ARC_DB.getTopScores(50);

    if (topRows.length === 0) {
      // Firebase config yok → yerel fallback
      const r1 = Math.max(0, best + 1), r3 = Math.max(0, sc - 1);
      topRows.push(
        { name: 'NEXUS',    avatar: 0, score: r1 },
        { name: playerName, avatar: avatarIdx, score: sc },
        { name: 'BYTE',     avatar: 4, score: r3 },
      );
    }

    // Rank ata, oyuncuyu işaretle (aynı isim + aynı skor → ilk eşleşme)
    let markedYou = false;
    const ann = topRows.map((r, i) => {
      const isYou = !markedYou && r.name === playerName && r.score === sc;
      if (isYou) markedYou = true;
      return { ...r, rank: i, isYou };
    });

    // Oyuncu top-50 dışındaysa doğru pozisyona ekle
    if (!markedYou) {
      const ins = ann.findIndex(r => r.score < sc);
      const pe  = { name: playerName, avatar: avatarIdx, score: sc, isYou: true };
      if (ins === -1) {
        pe.rank = ann.length;
        ann.push(pe);
      } else {
        pe.rank = ins;
        ann.splice(ins, 0, pe);
        for (let j = ins + 1; j < ann.length; j++) ann[j].rank = j;
      }
    }

    const youIdx = ann.findIndex(r => r.isYou);

    // Gösterilecek 4 satır: #1 + bir üst + kendim + bir alt
    const showSet = new Set([0]);
    if (youIdx > 0)                      showSet.add(youIdx - 1);
    showSet.add(youIdx);
    if (youIdx + 1 < ann.length)         showSet.add(youIdx + 1);
    const showArr = [...showSet].sort((a, b) => a - b);

    // Satırları oluştur; boşluk varsa ··· ayırıcı
    let html = '';
    let prev = -1;
    for (const idx of showArr) {
      if (prev >= 0 && idx > prev + 1) {
        html += `<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,.22);font-size:8px;padding:3px 0;letter-spacing:2px">···</td></tr>`;
      }
      const r  = ann[idx];
      const rc = AVATAR_COLORS[r.avatar] ?? '#fff';
      const rankStr = String(r.rank + 1).padStart(3, '0') + '.';
      html += `<tr class="${r.isYou ? 'you' : ''}" ${r.isYou ? `style="color:${avc}"` : ''}>
        <td style="white-space:nowrap">${rankStr}</td>
        <td style="padding:0 8px">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${rc};vertical-align:middle;margin-right:4px"></span>${r.name}
        </td>
        <td style="text-align:right">${pad(r.score)}</td>
      </tr>`;
      prev = idx;
    }
    rankRows.innerHTML = html;
  }

  // Dinamik hane: 0-999 → 3 hane | 1000-999999 → 6 | 1000000+ → 9
  const pad = n => {
    const v = Math.max(0, Math.floor(n));
    if (v < 1000)    return String(v).padStart(3, '0');
    if (v < 1000000) return String(v).padStart(6, '0');
    return             String(v).padStart(9, '0');
  };

  // ── Main draw loop ────────────────────────────────────────
  let lastT = 0;
  function loop(ts) {
    const dt   = Math.min(.033, (ts - lastT) / 1000 || 0); lastT = ts;
    const time = ts / 1000;

    // BG canvas: grid + arcs (home/settings)
    bctx.clearRect(0, 0, W, H);
    drawGrid(bctx, scene === 'play' || scene === 'over' ? camY : time * 22, .13);
    if (scene === 'home' || scene === 'settings') { tickBgArcs(dt); drawBgArcs(bctx); }

    // Game canvas
    ctx.clearRect(0, 0, W, H);
    if (scene === 'play' || scene === 'over') {
      drawWalls(); drawGhostTrail(); drawObstacles(); drawBonuses(); drawGoldBalls(); drawPurpleBalls();
      drawTrail(time); drawParticles(); drawPlayer(); drawRipples();
      // Tutorial katmanı — her zaman oyun üzerine çiz
      if (scene === 'play') { drawTutorial(time); drawBoosterBorder(); }
    }

    if (scene === 'play' && running) {
      step(dt); // step kendi içinde tutPaused kontrolü yapar
      hScore.textContent = pad(Math.floor(score));
      hBest.textContent  = pad(best);
      if (!tutPaused) refreshLB();
    }

    requestAnimationFrame(loop);
  }

  // ── Scene management ─────────────────────────────────────
  function showScene(s) {
    scene = s;
    profileSetupEl.classList.toggle('active', s === 'profile-setup');
    homeEl.classList.toggle('active',         s === 'home');
    settingsEl.classList.toggle('active',     s === 'settings');
    gameoverEl.classList.toggle('active',     s === 'over');
    hudEl.classList.toggle('active',          s === 'play');
    if (s === 'home') { applyProfile(); endTutorial(); }
    if (s !== 'play') tutHudEl.classList.remove('active');
  }

  // İlk açılışta profil oluşturma ekranını göster
  if (!localStorage.getItem('arc_name')) {
    showScene('profile-setup');
  } else {
    showScene('home');
  }

  // ── Tutorial HUD: SKIP butonu ──────────────────────────────
  document.getElementById('tut-skip-btn').addEventListener('click', () => {
    endTutorial();
  });

  // ── Reset Data ────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', () => {
    ['arc_best','arc_sfx','arc_mus','arc_fb','arc_firstplay','arc_name','arc_avatar'].forEach(k => localStorage.removeItem(k));
    best = 0; firstPlay = true;
    playerName = ''; avatarIdx = 0;
    if (homeBestV) homeBestV.textContent = pad(0);
    sfxSl.value = 80; musSl.value = 50;
    syncThumb(sfxSl, sfxTh); syncThumb(musSl, musTh);
    renderAvPicker(); applyProfile();
    const confirm = document.getElementById('reset-confirm');
    confirm.style.display = 'block';
    setTimeout(() => {
      confirm.style.display = 'none';
      showScene('profile-setup'); // isim sıfırlandı → yeniden oluştur
    }, 2000);
  });

  // ── Input ────────────────────────────────────────────────
  const haptic = (ms) => navigator.vibrate?.(ms); // sessizce desteklenmiyor ise atlar

  gc.addEventListener('pointerdown', e => {
    if (scene !== 'play') return;
    haptic(40);
    playTouchSound();
    const rect = gc.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top)  * (H / rect.height);
    ripples.push({ x: sx, y: S2W(sy), t: performance.now() / 1000 });

    if (running) {
      // Magnet booster: player.x'i parmak x'ine ışınla
      if (boosterType === 'magnet') player.x = sx;
      beginArc(-player.dir, getRadius());
      // Adım 3: sol %35'e dokunulursa ilerle
      if (tutStep === 3 && sx < W * 0.35) advanceTut(4);
      // Adım 4: sağ %35'e dokunulursa ilerle
      else if (tutStep === 4 && sx > W * 0.65) advanceTut(5);
    }
  });
  gc.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ── Profil UI ─────────────────────────────────────────────
  renderAvPicker();
  applyProfile();

  // ── Settings UI ───────────────────────────────────────────
  function syncThumb(sl, th) {
    const pct = (sl.value - sl.min) / (sl.max - sl.min);
    th.style.left = `calc(${pct*100}% - 2.5px)`;
  }
  syncThumb(sfxSl, sfxTh); syncThumb(musSl, musTh);
  sfxSl.addEventListener('input', () => syncThumb(sfxSl, sfxTh));
  musSl.addEventListener('input', () => { syncThumb(musSl, musTh); setMusicVolume(Number(musSl.value)); });

  // Zorluk seviyesi kaldırıldı — sabit EXTREME

  const fbOn  = document.getElementById('fb-on');
  const fbOff = document.getElementById('fb-off');
  function setFeedback(v) {
    feedbackOn = v;
    fbOn.className  = 'tog-btn ' + (v  ? 'active-on'  : 'active-off');
    fbOff.className = 'tog-btn ' + (!v ? 'active-on'  : 'active-off');
  }
  fbOn.addEventListener('click',  () => setFeedback(true));
  fbOff.addEventListener('click', () => setFeedback(false));
  setFeedback(feedbackOn);

  // ── Nav buttons ───────────────────────────────────────────
  function startGame(withTutorial) {
    initAudio(); // ilk etkileşim → AudioContext başlat / devam ettir
    resetGame();
    showScene('play');
    // Oyun hemen başlasın — ilk dokunuş bekleme
    beginArc(Math.random() < .5 ? -1 : 1, W / 4);
    started = true; running = true;
    if (withTutorial || firstPlay) {
      if (firstPlay) {
        firstPlay = false;
        localStorage.setItem('arc_firstplay', '0');
      }
      advanceTut(1); // adım 0 (touch to begin) atlandı, direkt 1'den başlat
    }
  }

  document.getElementById('btn-start').addEventListener('click', () => startGame());
  document.getElementById('wrap-start').addEventListener('click', () => startGame());

  // Home alt bağlantılar
  document.getElementById('btn-tutorial-link').addEventListener('click', () => {
    startGame(true); // tutorial ile başlat
  });
  document.getElementById('btn-credits').addEventListener('click', () => {
    alert('ArcRise\nv1.0 — 2025\nDesign & Code: Buğra Sulukcu');
  });

  document.getElementById('btn-settings').addEventListener('click', () => showScene('settings'));

  document.getElementById('btn-back').addEventListener('click', () => {
    localStorage.setItem('arc_sfx', sfxSl.value);
    localStorage.setItem('arc_mus', musSl.value);
    localStorage.setItem('arc_fb', feedbackOn ? '1' : '0');
    showScene('home');
  });

  document.getElementById('btn-again').addEventListener('click', () => startGame());
  document.getElementById('wrap-again').addEventListener('click', () => startGame());
  document.getElementById('btn-menu').addEventListener('click', () => showScene('home'));

  // ── Boot ─────────────────────────────────────────────────
  initBgArcs();
  resetGame();
  applyProfile();
  // showScene is called by the profile-setup check above (or after ps-confirm)
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
