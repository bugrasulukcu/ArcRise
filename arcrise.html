<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ArcRise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #7CFF7A;
      --red:   #ff3355;
      --bg:    #080a0e;
      --panel: rgba(10,13,22,0.92);
      --font:  'Press Start 2P', monospace;
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }
    body { font-family: var(--font); color: #fff; }

    /* ── Canvas layer ── */
    #wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .stack {
      position: relative;
      width: min(100vw, 56.25vh);
      height: 100vh;
    }
    canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }
    #bg  { z-index: 0; }
    #gc  { z-index: 1; touch-action: none; cursor: pointer; }

    /* ── Overlays ── */
    .screen {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 20;
      font-family: var(--font);
    }
    .screen.active { display: flex; }

    /* ── HUD ── */
    /* #hud artık .stack içinde — position: absolute ile canvas'a göre konumlanır */
    #hud {
      position: absolute; inset: 0;
      z-index: 15; pointer-events: none;
      display: none;
    }
    #hud.active { display: block; }

    /* Duvar iç kenarı: canvas 600px'de 20px sol/sağ → %3.33
       Güvenli bölge başlangıcı = calc(3.4% + 10px)                */
    .hud-tl {
      position: absolute; top: 18px;
      left: calc(3.4% + 12px);
    }
    .hud-tr {
      position: absolute; top: 18px;
      right: calc(3.4% + 12px);
      text-align: right;
    }
    .hud-lbl { font-size: 7px; color: var(--green); letter-spacing: 1px; margin-bottom: 6px; }
    .hud-num { font-size: 13px; letter-spacing: 1px; }
    /* Küçük avatar renk noktası YOUR BEST yanında */
    #hud-av { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }

    /* Leaderboard sidebar — sağ duvarın içinde */
    #lb {
      position: absolute; top: 0;
      right: calc(3.4% + 10px);
      width: 108px; height: 100%;
      display: flex; flex-direction: column;
      justify-content: center; gap: 5px;
      padding: 60px 0 20px 0;
      overflow: hidden;
    }
    .lb-row   { font-size: 5.5px; color: rgba(255,255,255,.28); text-align: right; white-space: nowrap; }
    .lb-row.you { font-size: 6px; }

    /* ══════════ PROFILE (Settings içinde) ══════════ */
    .profile-sect {
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 18px;
    }
    .profile-lbl { font-size: 6.5px; color: var(--green); letter-spacing: 2px; margin-bottom: 12px; }
    .av-picker { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .av-opt {
      width: 26px; height: 26px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      flex-shrink: 0;
    }
    .av-opt.sel { border-color: #fff; transform: scale(1.18); }
    .name-row { display: flex; gap: 8px; align-items: center; }
    #name-input {
      flex: 1; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      color: #fff; font-family: var(--font); font-size: 8px;
      letter-spacing: 2px; padding: 10px 12px;
      text-transform: uppercase; min-width: 0;
    }
    #name-input:focus { outline: none; border-color: var(--green); }
    #name-save {
      padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--green); background: rgba(124,255,122,.1);
      color: var(--green); font-family: var(--font);
      font-size: 7px; letter-spacing: 1px; cursor: pointer; flex-shrink: 0;
    }
    #name-save:active { transform: scale(0.95); }

    /* ══════════ HOME ══════════ */
    #home { gap: 0; }
    #title {
      font-size: clamp(34px, 9vw, 52px);
      letter-spacing: 3px;
      text-align: center;
      position: relative;
    }
    /* small ball on arc above title */
    #logo-canvas {
      display: block; margin: 0 auto 6px;
      width: clamp(200px, 55vw, 320px);
      height: clamp(50px, 13vw, 80px);
    }

    /* rainbow border wrapper */
    @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    .rb-wrap {
      padding: 2.5px; border-radius: 16px;
      background: conic-gradient(from var(--a), #ff2255,#ff7700,#ffe000,#7CFF7A,#00ccff,#8844ff,#ff2255);
      animation: spinA 3s linear infinite;
      cursor: pointer;
    }
    @keyframes spinA { to { --a: 360deg; } }
    .rb-inner {
      background: rgba(22,26,38,0.96);
      border-radius: 13px;
      padding: 17px 28px;
      font-family: var(--font);
      font-size: 20px; letter-spacing: 3px;
      color: #fff; text-align: center;
      user-select: none;
    }
    .rb-inner:active { transform: scale(0.97); }

    .menu { display: flex; flex-direction: column; gap: 14px; width: min(88vw, 310px); margin-top: 30px; }

    .btn-gray {
      padding: 14px 24px; border-radius: 13px;
      border: 1.5px solid rgba(255,255,255,.22);
      background: rgba(18,22,32,.85);
      color: #fff; font-family: var(--font);
      font-size: 13px; letter-spacing: 2px;
      cursor: pointer; width: 100%;
    }
    .btn-gray:active { transform: scale(0.97); }

    #home-best {
      font-size: 8px; letter-spacing: 1px; margin-top: 20px;
      color: var(--green); text-align: center;
    }
    #home-best span { color: #fff; }

    #credits {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      font-size: 6.5px; color: rgba(255,255,255,.3); letter-spacing: 1px;
    }

    /* ══════════ SETTINGS ══════════ */
    #settings .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 30px 26px 24px;
      width: min(90vw, 340px);
      display: flex; flex-direction: column; gap: 22px;
    }
    #settings h2 { font-size: 18px; text-align: center; letter-spacing: 2px; }

    .srow { display: flex; align-items: center; gap: 10px; }
    .sicon { font-size: 15px; width: 22px; text-align: center; flex-shrink: 0; }
    .slbl  { font-size: 8px; color: #999; letter-spacing: 1px; flex: 1; }
    .sctl  { display: flex; align-items: center; }

    /* Difficulty < Easy > */
    .darr { background: none; border: none; color: var(--green); font-family: var(--font); font-size: 13px; cursor: pointer; padding: 0 6px; }
    .dval {
      font-size: 8px; letter-spacing: 1px; color: #fff; min-width: 72px; text-align: center;
      background: rgba(0,180,160,.18); border: 1px solid rgba(0,210,180,.35);
      border-radius: 8px; padding: 7px 10px;
    }

    /* Rainbow slider */
    .rslide-wrap {
      position: relative; height: 18px; border-radius: 9px; overflow: visible;
      background: linear-gradient(to right,#ff2255,#ff7700,#ffe000,#7CFF7A,#00ccff,#8844ff);
    }
    .rslide-wrap input[type=range] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; margin: 0;
    }
    .rslide-thumb {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 5px; height: 26px; background: #fff;
      border-radius: 3px; pointer-events: none;
      box-shadow: 0 1px 6px rgba(0,0,0,.55);
    }

    /* On/Off toggle */
    .tog { display: flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
    .tog-btn { font-family: var(--font); font-size: 7px; letter-spacing: 1px; padding: 8px 12px; cursor: pointer; border: none; }
    .tog-btn.active-on  { background: var(--green); color: #000; }
    .tog-btn.active-off { background: rgba(255,255,255,.06); color: #666; }

    /* ══════════ GAME OVER ══════════ */
    #gameover .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 26px 22px 22px;
      width: min(90vw, 330px);
      display: flex; flex-direction: column; gap: 18px; align-items: center;
    }
    .rtable { width: 100%; border-collapse: collapse; }
    .rtable th { font-size: 6.5px; color: var(--green); letter-spacing: 1px; padding-bottom: 8px; text-align: left; }
    .rtable th:last-child { text-align: right; }
    .rtable td { font-size: 6.5px; color: rgba(255,255,255,.55); padding: 4px 0; }
    .rtable td:last-child { text-align: right; }
    .rtable tr.you td { color: #fff; }
    #go-best { font-size: 7.5px; color: var(--green); letter-spacing: 1px; text-align: center; }
    #go-best span { color: #fff; }

    /* ══════════ TUTORIAL ══════════ */
    #tutorial { pointer-events: none; }
    #touch-ring {
      position: fixed;
      width: 110px; height: 110px;
      border: 2px dashed rgba(255,255,255,.65);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; letter-spacing: 1px; color: rgba(255,255,255,.8);
      font-family: var(--font);
      animation: tpulse 1.6s ease-in-out infinite;
    }
    @keyframes tpulse {
      0%,100% { transform: scale(1); opacity: .7; }
      50%      { transform: scale(1.1); opacity: 1; }
    }

    /* ══════════ IN-GAME TUTORIAL HUD ══════════ */
    /* Alt banner: adım başlığı + açıklama + skip */
    #tut-hud {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 25; pointer-events: none;
      display: none;
    }
    #tut-hud.active { display: block; }
    #tut-banner {
      background: rgba(8,10,14,0.92);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(6px);
      padding: 14px 20px 18px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; pointer-events: auto;
    }
    #tut-banner-left { flex: 1; }
    #tut-banner-title {
      font-size: 9px; letter-spacing: 2px; color: var(--green);
      margin-bottom: 7px;
    }
    #tut-banner-desc {
      font-size: 6.5px; color: rgba(255,255,255,.5);
      letter-spacing: 1px; line-height: 1.8;
    }
    #tut-banner-right {
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0;
    }
    #tut-step-dots { display: flex; gap: 5px; }
    .tut-sdot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(255,255,255,.18); transition: background .25s;
    }
    .tut-sdot.active { background: var(--green); }
    #tut-skip-btn {
      background: none; border: 1px solid rgba(255,255,255,.18);
      border-radius: 7px; color: rgba(255,255,255,.4);
      font-family: var(--font); font-size: 6px;
      letter-spacing: 1px; padding: 6px 11px; cursor: pointer;
    }
    #tut-skip-btn:hover { color: #fff; border-color: rgba(255,255,255,.4); }

    /* ── HOME alt bağlantıları ── */
    #home-links {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 24px; align-items: center;
    }
    .home-link {
      font-size: 6.5px; color: rgba(255,255,255,.3);
      letter-spacing: 1px; cursor: pointer; background: none;
      border: none; font-family: var(--font);
    }
    .home-link:hover { color: rgba(255,255,255,.6); }

    /* ══════════ PROFILE SETUP (ilk açılış) ══════════ */
    #profile-setup .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 22px;
      padding: 28px 22px 24px;
      width: min(92vw, 360px);
      display: flex; flex-direction: column; gap: 20px; align-items: center;
    }
    #profile-setup h2 { font-size: 14px; letter-spacing: 2px; text-align: center; }
    #profile-setup .ps-sub { font-size: 6px; color: rgba(255,255,255,.35); letter-spacing: 1px; text-align: center; }
    #av-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; width: 100%;
    }
    .av-img-opt {
      width: 100%; aspect-ratio: 1; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      background-size: cover; background-position: center;
      overflow: hidden;
    }
    .av-img-opt img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .av-img-opt.sel { border-color: #fff; transform: scale(1.12); }
    #ps-name-row { display: flex; gap: 8px; width: 100%; align-items: center; }
    #ps-name-input {
      flex: 1; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      color: #fff; font-family: var(--font); font-size: 9px;
      letter-spacing: 2px; padding: 12px 14px;
      text-transform: uppercase; min-width: 0; text-align: center;
    }
    #ps-name-input:focus { outline: none; border-color: var(--green); }
    #ps-confirm {
      width: 100%; padding: 15px; border-radius: 13px;
      border: 1.5px solid var(--green); background: rgba(124,255,122,.12);
      color: var(--green); font-family: var(--font);
      font-size: 12px; letter-spacing: 3px; cursor: pointer;
    }
    #ps-confirm:active { transform: scale(0.97); }

    /* ══════════ HOME DIFFICULTY SELECTOR ══════════ */
    #home-diff {
      display: flex; align-items: center; gap: 10px;
      margin-top: 18px;
    }
    #home-diff .darr { font-size: 14px; }
    #hd-label {
      font-size: 8px; letter-spacing: 1px; color: #fff; min-width: 76px; text-align: center;
      background: rgba(0,180,160,.18); border: 1px solid rgba(0,210,180,.35);
      border-radius: 8px; padding: 7px 10px;
    }
    #hd-mul {
      font-size: 6px; color: rgba(255,255,255,.4);
      letter-spacing: 1px; text-align: center; margin-top: 4px;
    }

    /* ══════════ SETTINGS profile (read-only) ══════════ */
    #settings-profile-ro {
      display: flex; align-items: center; gap: 12px;
      padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,.08);
    }
    #settings-av-img {
      width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
      overflow: hidden; border: 2px solid rgba(255,255,255,.2);
    }
    #settings-av-img img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    #settings-name-lbl { font-size: 9px; letter-spacing: 2px; }
    #settings-name-sub { font-size: 5.5px; color: rgba(255,255,255,.3); letter-spacing: 1px; margin-top: 5px; }

    /* av-picker in settings — image thumbnails */
    .av-opt {
      width: 30px; height: 30px; border-radius: 50%;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color .18s, transform .15s;
      flex-shrink: 0; overflow: hidden;
    }
    .av-opt img { width: 100%; height: 100%; border-radius: 50%; display: block; }
    .av-opt.sel { border-color: #fff; transform: scale(1.18); }

    /* ── RESET butonu (Settings'te) ── */
    .btn-danger {
      padding: 12px 24px; border-radius: 13px;
      border: 1.5px solid rgba(255,51,85,.45);
      background: rgba(255,51,85,.08);
      color: #ff3355; font-family: var(--font);
      font-size: 8px; letter-spacing: 1px;
      cursor: pointer; width: 100%;
    }
    .btn-danger:active { transform: scale(0.97); }

    /* Onay baloncuğu */
    #reset-confirm {
      display: none; font-size: 7px; color: rgba(255,255,255,.5);
      letter-spacing: 1px; text-align: center; margin-top: -10px;
    }
  </style>
</head>
<body>

<!-- ── Canvas + HUD (aynı stack içinde, duvar sınırlarına göre konumlanır) ── -->
<div id="wrap">
  <div class="stack">
    <canvas id="bg"></canvas>
    <canvas id="gc"></canvas>
    <div id="hud">
      <div class="hud-tl">
        <div class="hud-lbl">SCORE</div>
        <div class="hud-num" id="h-score">000</div>
      </div>
      <div class="hud-tr">
        <div class="hud-lbl">YOUR BEST <span id="hud-av"></span></div>
        <div class="hud-num" id="h-best">000</div>
      </div>
      <div id="lb"></div>
    </div>
  </div>
</div>

<!-- ══ PROFILE SETUP ══ -->
<div class="screen" id="profile-setup">
  <div class="panel">
    <h2>CREATE PROFILE</h2>
    <div class="ps-sub">Your name cannot be changed later.</div>
    <div id="av-grid"></div>
    <div id="ps-name-row">
      <input type="text" id="ps-name-input" maxlength="8" placeholder="YOUR NAME"
             spellcheck="false" autocomplete="off">
    </div>
    <button id="ps-confirm">CONFIRM</button>
  </div>
</div>

<!-- ══ HOME ══ -->
<div class="screen" id="home">
  <canvas id="logo-canvas"></canvas>
  <h1 id="title">ArcRise</h1>
  <div class="menu">
    <div class="rb-wrap" id="wrap-start">
      <div class="rb-inner" id="btn-start">Start</div>
    </div>
    <button class="btn-gray" id="btn-settings">Settings</button>
  </div>
  <div id="home-diff">
    <button class="darr" id="hd-prev">&#60;</button>
    <div>
      <div id="hd-label">NORMAL</div>
      <div id="hd-mul">SCORE ×1.0</div>
    </div>
    <button class="darr" id="hd-next">&#62;</button>
  </div>
  <div id="home-best">YOUR BEST&nbsp;&nbsp;<span id="home-best-val">000</span></div>
  <div id="home-links">
    <button class="home-link" id="btn-tutorial-link">TUTORIAL</button>
    <span style="color:rgba(255,255,255,.12);font-size:10px">·</span>
    <button class="home-link" id="btn-credits">CREDITS</button>
  </div>
</div>

<!-- ══ SETTINGS ══ -->
<div class="screen" id="settings">
  <div class="panel">
    <h2>Settings</h2>

    <!-- ── Profile (read-only) ── -->
    <div id="settings-profile-ro">
      <div id="settings-av-img"><img id="settings-av-src" src="" alt=""></div>
      <div>
        <div id="settings-name-lbl">PLAYER</div>
        <div id="settings-name-sub">NAME LOCKED</div>
      </div>
    </div>

    <!-- ── Avatar picker (still changeable) ── -->
    <div class="profile-sect">
      <div class="profile-lbl">AVATAR</div>
      <div class="av-picker" id="av-picker"></div>
    </div>

    <div class="srow">
      <span class="sicon">🔔</span>
      <span class="slbl">SFX</span>
      <div class="sctl">
        <div class="rslide-wrap" style="width:155px">
          <input type="range" id="sfx-sl" min="0" max="100" value="80">
          <div class="rslide-thumb" id="sfx-th"></div>
        </div>
      </div>
    </div>

    <div class="srow">
      <span class="sicon">🎵</span>
      <span class="slbl">Music</span>
      <div class="sctl">
        <div class="rslide-wrap" style="width:95px">
          <input type="range" id="mus-sl" min="0" max="100" value="50">
          <div class="rslide-thumb" id="mus-th"></div>
        </div>
      </div>
    </div>

    <div class="srow">
      <span class="sicon">⚙️</span>
      <span class="slbl">Feedback</span>
      <div class="sctl">
        <div class="tog">
          <button class="tog-btn active-on"  id="fb-on">On</button>
          <button class="tog-btn active-off" id="fb-off">Off</button>
        </div>
      </div>
    </div>

    <button class="btn-gray" id="btn-back" style="margin-top:4px">Back</button>
    <button class="btn-danger" id="btn-reset">🗑 Reset Data</button>
    <div id="reset-confirm">Veriler silindi. ✓</div>
  </div>
</div>

<!-- ══ GAME OVER ══ -->
<div class="screen" id="gameover">
  <div class="panel">
    <table class="rtable">
      <thead>
        <tr><th>RANK</th><th style="padding:0 10px">NAME</th><th>SCORE</th></tr>
      </thead>
      <tbody id="rank-rows"></tbody>
    </table>
    <div style="width:100%;display:flex;flex-direction:column;gap:12px">
      <div class="rb-wrap" id="wrap-again">
        <div class="rb-inner" id="btn-again" style="font-size:18px">Again!</div>
      </div>
      <button class="btn-gray" id="btn-menu" style="font-size:11px">Back to Menu</button>
    </div>
    <div id="go-best">YOUR BEST&nbsp;&nbsp;<span id="go-best-val">000</span></div>
  </div>
</div>

<!-- ══ IN-GAME TUTORIAL HUD ══ -->
<div id="tut-hud">
  <div id="tut-banner">
    <div id="tut-banner-left">
      <div id="tut-banner-title">TOUCH ANYWHERE</div>
      <div id="tut-banner-desc">Ekrana dokunarak oynamaya başla</div>
    </div>
    <div id="tut-banner-right">
      <div id="tut-step-dots">
        <div class="tut-sdot active"></div>
        <div class="tut-sdot"></div>
        <div class="tut-sdot"></div>
        <div class="tut-sdot"></div>
        <div class="tut-sdot"></div>
      </div>
      <button id="tut-skip-btn">SKIP</button>
    </div>
  </div>
</div>

<!--
  ══════════════════════════════════════════════════════════
  Firebase kurulumu:

const ARC_DB = (() => {
  const { apiKey, projectId } = FIREBASE_CONFIG;
  const BASE = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents`;

  // Skor kaydet
  async function submitScore(name, avatar, score) {
    if (!projectId || projectId.startsWith('BURAYA')) return; // config yoksa sessizce atla
    try {
      await fetch(`${BASE}/scores?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fields: {
          name:   { stringValue: name  },
          avatar: { integerValue: String(avatar) },
          score:  { integerValue: String(score)  },
          ts:     { integerValue: String(Date.now()) },
        }}),
      });
    } catch(e) { console.warn('[ArcDB] submit failed', e); }
  }

  // Top-N skor çek
  async function getTopScores(n = 10) {
    if (!projectId || projectId.startsWith('BURAYA')) return [];
    try {
      const res = await fetch(`${BASE}:runQuery?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ structuredQuery: {
          from:    [{ collectionId: 'scores' }],
          orderBy: [{ field: { fieldPath: 'score' }, direction: 'DESCENDING' }],
          limit:   n,
        }}),
      });
      const rows = await res.json();
      return rows
        .filter(r => r.document?.fields)
        .map(r => ({
          name:   r.document.fields.name.stringValue,
          avatar: parseInt(r.document.fields.avatar.integerValue ?? 3),
          score:  parseInt(r.document.fields.score.integerValue ?? 0),
        }));
    } catch(e) { console.warn('[ArcDB] fetch failed', e); return []; }
  }

  return { submitScore, getTopScores };
})();

  // Her BG arc: bir "top" dairesel yay üzerinde hareket eder, arkasında iz bırakır.
  // Tıpkı oyundaki topun yaptığı gibi — gerçek dairesel kinematik.
  function newBgArc(preAge) {
    const color  = RAINBOW[Math.floor(Math.random() * RAINBOW.length)];
    const radius = 90 + Math.random() * 220;           // dairenin yarıçapı
    const cx     = (Math.random() * 0.85 + 0.075) * W; // daire merkezi
    const cy     = (Math.random() * 0.85 + 0.075) * H;
    const startA = Math.random() * Math.PI * 2;        // başlangıç açısı
    const dir    = Math.random() < 0.5 ? 1 : -1;       // CW / CCW
    const speed  = 110 + Math.random() * 140;          // px/s yay boyunca
    const omega  = dir * speed / radius;               // rad/s
    const maxLen = Math.PI * (0.6 + Math.random() * 1.1); // kaç radyan çizilecek
    const drawT  = maxLen / Math.abs(omega);           // çizim süresi
    const age    = preAge ?? 0;
    return { cx, cy, radius, startA, dir, omega, maxLen, drawT, color, age };
  }

  function initBgArcs() {
    bgArcs.length = 0;
    // Aralarına dağıtılmış preAge ile başlatılsın ki hepsi aynı anda başlamasın
    for (let i = 0; i < 8; i++) bgArcs.push(newBgArc(Math.random() * 4.5));
  }

  function tickBgArcs(dt) {
    const FADE_OUT = 1.0; // çizim bittikten sonra solma süresi
    for (let i = bgArcs.length - 1; i >= 0; i--) {
      const a = bgArcs[i];
      a.age += dt;
      if (a.age >= a.drawT + FADE_OUT) { bgArcs.splice(i, 1); bgArcs.push(newBgArc()); }
    }
    while (bgArcs.length < 8) bgArcs.push(newBgArc());
  }

  function drawBgArcs(ctx2) {
    const FADE_IN  = 0.35;
    const FADE_OUT = 1.0;
    ctx2.save();
    for (const a of bgArcs) {
      // Alpha: fade-in → tam → fade-out
      let alpha;
      if      (a.age < FADE_IN)   alpha = a.age / FADE_IN;
      else if (a.age < a.drawT)   alpha = 1;
      else alpha = Math.max(0, 1 - (a.age - a.drawT) / FADE_OUT);
      if (alpha <= 0) continue;

      // Şu ana kadar çizilen yay uzunluğu (radyan)
      const drawn  = Math.min(a.maxLen, Math.abs(a.omega) * a.age);
      // Topun şu anki açısı
      const curAng = a.startA + a.dir * drawn;

      // ── İz (trail) — büyüyen yay ───────────────────────────
      ctx2.globalAlpha = alpha * 0.55;
      ctx2.strokeStyle = a.color;
      ctx2.lineWidth   = 1.5;
      ctx2.lineCap     = 'round';
      ctx2.beginPath();
      // dir=1 → CW (false), dir=-1 → CCW (true)
      if (a.dir > 0) ctx2.arc(a.cx, a.cy, a.radius, a.startA, curAng, false);
      else            ctx2.arc(a.cx, a.cy, a.radius, curAng, a.startA, false);
      ctx2.stroke();

      // ── Top — sadece çizim aşamasında (fade-out'ta kaybolur) ─
      if (a.age < a.drawT) {
        const bx = a.cx + Math.cos(curAng) * a.radius;
        const by = a.cy + Math.sin(curAng) * a.radius;
        const br = 5;
        // Yumuşak parıltı
        ctx2.globalAlpha = alpha * 0.28;
        ctx2.strokeStyle = a.color;
        ctx2.lineWidth   = 1;
        ctx2.beginPath(); ctx2.arc(bx, by, br * 2.8, 0, Math.PI * 2); ctx2.stroke();
        // Siyah gövde
        ctx2.globalAlpha = alpha * 0.9;
        ctx2.fillStyle   = '#000';
        ctx2.beginPath(); ctx2.arc(bx, by, br, 0, Math.PI * 2); ctx2.fill();
        // Renkli kenar
        ctx2.strokeStyle = a.color;
        ctx2.lineWidth   = 1.5;
        ctx2.beginPath(); ctx2.arc(bx, by, br, 0, Math.PI * 2); ctx2.stroke();
      }
    }
    ctx2.restore();
  }

  // ── Grid ─────────────────────────────────────────────────
  function drawGrid(ctx2, oy = 0, alpha = 0.13, sz = 40) {
    ctx2.save();
    ctx2.globalAlpha  = alpha;
    ctx2.strokeStyle  = '#fff';
    ctx2.lineWidth    = 0.5;
    const off = ((oy % sz) + sz) % sz;
    for (let y = off; y < H; y += sz) { ctx2.beginPath(); ctx2.moveTo(0,y); ctx2.lineTo(W,y); ctx2.stroke(); }
    for (let x = 0;   x < W; x += sz) { ctx2.beginPath(); ctx2.moveTo(x,0); ctx2.lineTo(x,H); ctx2.stroke(); }
    ctx2.restore();
  }

  // ── Walls ────────────────────────────────────────────────
  const walls = { left: 20, right: W - 20 };
  function drawWalls() {
    ctx.save();
    ctx.fillStyle = 'rgba(255,51,85,.09)';
    ctx.fillRect(0, 0, walls.left, H);
    ctx.fillRect(walls.right, 0, W - walls.right, H);
    ctx.fillStyle = '#ff3355';
    ctx.fillRect(walls.left - 10, 0, 10, H);
    ctx.fillRect(walls.right,     0, 10, H);
    ctx.restore();
  }

  // ── Obstacles ────────────────────────────────────────────
  function drawObstacles() {
    for (const ob of obstacles) {
      const sx = ob._ox ?? ob.x, sy = W2S(ob._oy ?? ob.y);
      if (sy < -100 || sy > H + 100) continue;
      // core only — no glow
      ctx.save();
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, ob.r);
      g.addColorStop(0, 'rgba(255,140,160,.92)'); g.addColorStop(1, 'rgba(200,55,80,.78)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, ob.r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // ── Bonuses ──────────────────────────────────────────────
  function drawBonuses() {
    for (const b of bonuses) {
      const sy = W2S(b.y);
      if (sy < -100 || sy > H + 100) continue;
      let g = ctx.createRadialGradient(b.x, sy, 0, b.x, sy, b.r * 2.8);
      g.addColorStop(0, 'rgba(124,255,122,.9)'); g.addColorStop(1, 'rgba(60,255,60,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, sy, b.r * 2.8, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7CFF7A'; ctx.beginPath(); ctx.arc(b.x, sy, b.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // ── Ghost Trail (önceki oyun, %20 opaklık) ───────────────
  function drawGhostTrail() {
    if (ghostTrail.length < 2) return;
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.lineWidth   = 2;
    ctx.lineCap     = 'round';
    for (let i = 1; i < ghostTrail.length; i++) {
      const a = ghostTrail[i-1], b = ghostTrail[i];
      const ay = W2S(a.y), by = W2S(b.y);
      if (Math.max(ay, by) < -80 || Math.min(ay, by) > H + 80) continue;
      ctx.strokeStyle = `hsl(${a.h},100%,65%)`;
      ctx.beginPath();
      ctx.moveTo(a.x, ay);
      ctx.lineTo(b.x, by);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ── Trail ────────────────────────────────────────────────
  function drawTrail(time) {
    if (trail.length < 2) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < trail.length; i++) {
      const a = trail[i-1], b = trail[i];
      const t = i / (trail.length - 1);
      const al = Math.pow(t, 1.4) * 0.9;
      const w  = 1 + t * 3.8;
      const h1 = ((time * 80) + i * 3) % 360;
      const h2 = (h1 + 35) % 360;
      const gr = ctx.createLinearGradient(a.x, W2S(a.y), b.x, W2S(b.y));
      gr.addColorStop(0, `hsla(${h1},100%,65%,${al})`);
      gr.addColorStop(1, `hsla(${h2},100%,65%,${al})`);
      ctx.strokeStyle = gr; ctx.lineWidth = w; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(a.x, W2S(a.y)); ctx.lineTo(b.x, W2S(b.y)); ctx.stroke();
    }
    ctx.restore();
  }

  // ── Player ───────────────────────────────────────────────
  function drawPlayer() {
    ctx.save();
    const px = player.x, py = W2S(player.y), r = player.r;

    // Dar glow — 1/3 yarıçap (r*1.85)
    let g = ctx.createRadialGradient(px, py, 0, px, py, r * 1.85);
    g.addColorStop(0,   `rgba(124,255,122,${.75 * energy})`);
    g.addColorStop(0.45,`rgba(124,255,122,${.35 * energy})`);
    g.addColorStop(1,   'rgba(124,255,122,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 1.85, 0, Math.PI*2); ctx.fill();

    // Siyah gövde
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.fill();

    // Ring — neon near-white green stroke
    ctx.strokeStyle = `rgba(220,255,220,${.95 * energy})`;
    ctx.lineWidth = 4.5;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI*2); ctx.stroke();

    // Geri sayım: 9'dan 1'e (0 = oyun bitti)
    const countdown = Math.ceil(energy * 9);
    const countCol = countdown <= 3 ? `rgba(255,${Math.floor(80 + countdown*40)},80,0.95)` : '#fff';
    ctx.fillStyle = countCol;
    ctx.font = `${r < 20 ? 7 : 9}px 'Press Start 2P', monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(countdown), px, py);
    ctx.restore();
  }

  // ── Ripples ──────────────────────────────────────────────
  function drawRipples() {
    const now = performance.now() / 1000;
    for (const rp of ripples) {
      const age = now - rp.t; if (age > 1) continue;
      ctx.save();
      ctx.strokeStyle = `rgba(124,255,122,${(1-age)*.45})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(rp.x, W2S(rp.y), 20 + age * 80, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
  }

  // ── Leaderboard ──────────────────────────────────────────
  const LB_NAMES = ['ALEXXX','BYTE','NEXUS','STORM','VOID','ECHO','PULSE','ORBIT','FLUX','NOVA','ZERO','SIGMA'];
  let lbFrame = 0;

  // Firestore'dan canlı skorları çek, lbNPCScores'u doldur
  async function fetchLiveScores() {
    try {
      const rows = await ARC_DB.getTopScores(20);
      if (rows && rows.length > 0) {
        // Oyuncunun kendi satırını dışarıda bırak; refreshLB dinamik ekleyecek
        lbNPCScores = rows
          .filter(r => r.name !== playerName)
          .map(r => ({ n: r.name, s: r.score }));
      } else {
        // Firebase boş / ulaşılamadı → sahte NPC'ler
        lbNPCScores = LB_NAMES.map(n => ({ n, s: 2 + Math.floor(Math.random() * 18) }));
        lbNPCScores.sort((a, b) => b.s - a.s);
      }
    } catch (e) {
      lbNPCScores = LB_NAMES.map(n => ({ n, s: 2 + Math.floor(Math.random() * 18) }));
      lbNPCScores.sort((a, b) => b.s - a.s);
    }
  }

  function refreshLB() {
    lbFrame++;
    if (lbFrame % 30 !== 0) return; // update every 30 frames
    const sc  = Math.floor(score);
    const avc = AVATAR_COLORS[avatarIdx];
    // NPC'leri ve oyuncuyu birleştir, skora göre sırala
    const rows = [...lbNPCScores, { n: playerName, s: sc, you: true }];
    rows.sort((a, b) => b.s - a.s);
    // Oyuncunun sırası
    const youIdx = rows.findIndex(r => r.you);
    // Oyuncu ortada kalacak şekilde 12 satır dilim
    const start = Math.max(0, youIdx - 5);
    const slice = rows.slice(start, start + 13);
    lbEl.innerHTML = slice.map(r =>
      r.you
        ? `<div class="lb-row you" style="color:${avc}">▶ ${r.n}</div>`
        : `<div class="lb-row">${r.n}</div>`
    ).join('');
  }

  // ── World helpers ─────────────────────────────────────────
  const W2S = y => y - camY;
  const S2W = y => y + camY;

  // Yatay: sol → küçük radius, sağ → büyük radius
  function mapRadius(sx) {
    const minR = H * 0.022; // ~23px
    const maxR = H * 0.115; // ~122px
    return minR + (maxR - minR) * (sx / W);
  }
  function beginArc(sign, radius) {
    player.dir = sign; player.radius = radius;
    const nx = -Math.sin(player.heading) * sign;
    const ny =  Math.cos(player.heading) * sign;
    player.cx = player.x + nx * radius;
    player.cy = player.y + ny * radius;
    player.ang = Math.atan2(player.y - player.cy, player.x - player.cx);
  }

  // ── Tutorial çizim sistemi ────────────────────────────────
  function dashedRing(x, y, r, color, dash = [9, 6]) {
    ctx.save();
    ctx.setLineDash(dash);
    ctx.strokeStyle = color;
    ctx.lineWidth   = 1.8;
    ctx.globalAlpha = tutAlpha;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function tutLabel(cx, cy, line1, line2, col1 = '#fff', col2 = '#fff') {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillText(line1, cx + 1, cy + 1);
    if (line2) ctx.fillText(line2, cx + 1, cy + 17);
    ctx.fillStyle = col1;
    ctx.fillText(line1, cx, cy);
    if (line2) { ctx.fillStyle = col2; ctx.fillText(line2, cx, cy + 17); }
    ctx.restore();
  }

  // "FROM THE RED" → "FROM " normal + "THE RED" kırmızı
  function tutLabelMixed(cx, cy, line1, prefix, highlight, col1 = '#fff') {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    ctx.fillStyle = col1;
    ctx.fillText(line1, cx, cy);
    // measure prefix + highlight widths
    const fullW  = ctx.measureText(prefix + highlight).width;
    const preW   = ctx.measureText(prefix).width;
    const startX = cx - fullW / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(prefix, startX, cy + 17);
    ctx.fillStyle = '#ff3355';
    ctx.fillText(highlight, startX + preW, cy + 17);
    ctx.restore();
  }

  // "COLLECT GREEN / TO MOVE" → "COLLECT " normal + "GREEN" yeşil
  function tutLabelGreen(cx, cy) {
    ctx.save();
    ctx.globalAlpha  = tutAlpha;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.font         = '9px "Press Start 2P", monospace';
    const l1 = 'COLLECT GREEN';
    const fullW = ctx.measureText(l1).width;
    const preW  = ctx.measureText('COLLECT ').width;
    const sx    = cx - fullW / 2;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff'; ctx.fillText('COLLECT ', sx, cy);
    ctx.fillStyle = '#7CFF7A'; ctx.fillText('GREEN', sx + preW, cy);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('TO MOVE', cx, cy + 17);
    ctx.restore();
  }

  function drawTutorial(time) {
    if (tutStep < 0 || tutStep > 4) return;

    // fade in/out (0→1 in 0.4s, stays, 1→0 in last 0.4s for timed steps)
    tutAlpha = Math.min(1, tutAlpha);

    const pulse = 0.75 + 0.25 * Math.sin(time * 3.5); // pulsing ring

    if (tutStep === 0) {
      // ── Adım 0: TOUCH ──────────────────────────────────────
      const rx = W * 0.72, ry = H * 0.72;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([9, 6]);
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 56, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx, ry, 'TOUCH', null, '#fff');

    } else if (tutStep === 1) {
      // ── Adım 1: COLLECT GREEN TO MOVE ──────────────────────
      // Ekranda görünen ilk bonus etrafında yeşil dashed ring
      const b = bonuses.find(bo => { const sy = W2S(bo.y); return sy > 60 && sy < H - 60; });
      if (b) {
        const sy = W2S(b.y);
        dashedRing(b.x, sy, b.r + 22, `rgba(124,255,122,${pulse * .85})`);
        tutLabelGreen(b.x, sy - b.r - 46);
      }

    } else if (tutStep === 2) {
      // ── Adım 2: STAY AWAY FROM THE RED ─────────────────────
      // Ekranda görünen ilk engel etrafında kırmızı dashed ring
      const ob = obstacles.find(o => { const sy = W2S(o._oy ?? o.y); return sy > 60 && sy < H - 60; });
      if (ob) {
        const sx = ob._ox ?? ob.x, sy = W2S(ob._oy ?? ob.y);
        ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
        ctx.setLineDash([9, 6]);
        ctx.strokeStyle = `rgba(255,51,85,.85)`; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(sx, sy, ob.r + 22, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        tutLabelMixed(sx, sy - ob.r - 46, 'STAY AWAY', 'FROM ', 'THE RED');
      }

    } else if (tutStep === 3) {
      // ── Adım 3: TOUCH RIGHT → WIDE ARC ──────────────────────
      const rx = W * 0.82, ry = H * 0.42;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([10, 7]);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 68, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx - 90, ry, 'TOUCH RIGHT', 'WIDE ARC');

    } else if (tutStep === 4) {
      // ── Adım 4: TOUCH LEFT → TIGHT ARC ─────────────────────
      const rx = W * 0.18, ry = H * 0.42;
      ctx.save(); ctx.globalAlpha = tutAlpha * pulse;
      ctx.setLineDash([10, 7]);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(rx, ry, 52, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      tutLabel(rx + 80, ry, 'TOUCH LEFT', 'TIGHT ARC');
    }
  }

  function advanceTut(nextStep) {
    tutStep  = nextStep;
    tutTimer = 0;
    tutAlpha = 0; // sıfırdan fade-in
    updateTutHud();
  }

  function endTutorial() {
    tutStep = -1;
    tutHudEl.classList.remove('active');
  }

  function resetGame() {
    player.x = W/2; player.y = H - 200;
    player.heading = -Math.PI/2; player.dir = 0;
    player.speed = SPEEDS[diffIdx];
    camY = 0; trail.length = 0; obstacles.length = 0; bonuses.length = 0; ripples.length = 0;
    nextSpawnY = player.y - 500; lastBonusY = player.y;
    score = 0; maxAscend = 0; energy = 1;
    started = false; running = false; lbFrame = 0;
    tutStep = -1; tutTimer = 0; tutAlpha = 0; tutPaused = false;
    // Firestore'dan gerçek skorları arka planda çek
    fetchLiveScores();
    initBgArcs();
  }

  function spawnAhead() {
    while (nextSpawnY > player.y - 2200) {
      const sc = score;
      const x  = walls.left + 55 + Math.random() * (walls.right - walls.left - 110);

      // Gap azalıyor
      let gMin, gMax;
      if      (sc < 50)  { gMin = 280; gMax = 430; }
      else if (sc < 120) { gMin = 240; gMax = 370; }
      else if (sc < 250) { gMin = 200; gMax = 320; }
      else if (sc < 450) { gMin = 170; gMax = 280; }
      else               { gMin = 150; gMax = 250; }
      const gap = gMin + Math.random() * (gMax - gMin);

      const needBonus = (lastBonusY - nextSpawnY) > 540;
      if (needBonus || Math.random() < (sc < 80 ? .36 : .52)) {
        bonuses.push({ x, y: nextSpawnY, r: 11 + Math.random() * 7 });
        lastBonusY = nextSpawnY;
      } else {
        // Engel boyutu büyüyor
        let rMin, rMax;
        if      (sc < 50)  { rMin = 18; rMax = 30; }
        else if (sc < 120) { rMin = 26; rMax = 42; }
        else if (sc < 250) { rMin = 34; rMax = 54; }
        else if (sc < 450) { rMin = 42; rMax = 65; }
        else               { rMin = 50; rMax = 78; }
        const r = rMin + Math.random() * (rMax - rMin);

        const ob = { x, y: nextSpawnY, r };

        // Hareket sistemi (250 puan üstü)
        if (sc >= 250) {
          const tier = Math.floor((sc - 250) / 250) + 1; // her 250 puan +1
          ob.ma  = tier * 0.1 * 2 * r;           // genlik: çapın %10'u × tier
          ob.mf  = 0.6 + Math.random() * 0.8;    // frekans (rad/s)
          ob.mt  = Math.random() * Math.PI * 2;   // faz ofseti

          if (sc >= 1000) {
            ob.mk    = 'rand';
            ob.mang  = Math.random() * Math.PI * 2;
            ob.mnext = 1.5 + Math.random() * 2;
            ob.mct   = 0;
          } else if (sc >= 500) {
            ob.mk   = 'diag';
            ob.mang = Math.random() * Math.PI * 2;
          } else {
            ob.mk = Math.random() < 0.5 ? 'h' : 'v';
          }
        }

        obstacles.push(ob);
      }
      nextSpawnY -= gap;
    }
  }

  function step(dt) {
    if (!running || tutPaused) return;
    const w  = player.speed / player.radius;
    player.ang += w * dt * player.dir;
    player.x    = player.cx + Math.cos(player.ang) * player.radius;
    player.y    = player.cy + Math.sin(player.ang) * player.radius;
    player.heading = player.ang + (player.dir > 0 ? Math.PI/2 : -Math.PI/2);

    energy = Math.max(0, energy - dt * ENERGY_DECAY);
    if (energy <= 0) { endGame(); return; }

    const now = performance.now() / 1000;

    if (!trail.length || Math.hypot(player.x - trail.at(-1).x, player.y - trail.at(-1).y) > 2) {
      const th = (now * 80 + trail.length * 3) % 360; // anlık ton rengi
      trail.push({ x: player.x, y: player.y, h: th });
      if (trail.length > 600) trail.shift();
    }

    for (let i = ripples.length - 1; i >= 0; i--) { if (now - ripples[i].t > 1) ripples.splice(i,1); }

    const pyS = W2S(player.y);
    if (pyS < H * .5) camY -= (H * .5 - pyS);

    maxAscend = Math.max(maxAscend, -player.y);
    score     = Math.floor(maxAscend / 200 * SCORE_MUL[diffIdx]);

    spawnAhead();

    for (const ob of obstacles) {
      if (ob.mk) {
        ob.mt += dt;
        const s = Math.sin(ob.mt * ob.mf) * ob.ma;
        if      (ob.mk === 'h')    { ob._ox = ob.x + s;                            ob._oy = ob.y; }
        else if (ob.mk === 'v')    { ob._ox = ob.x;                                ob._oy = ob.y + s; }
        else if (ob.mk === 'diag') { ob._ox = ob.x + Math.cos(ob.mang) * s;        ob._oy = ob.y + Math.sin(ob.mang) * s; }
        else { // rand
          ob.mct += dt;
          if (ob.mct >= ob.mnext) { ob.mang = Math.random() * Math.PI * 2; ob.mnext = 1.5 + Math.random() * 2; ob.mct = 0; }
          ob._ox = ob.x + Math.cos(ob.mang) * s; ob._oy = ob.y + Math.sin(ob.mang) * s;
        }
      } else { ob._ox = ob.x; ob._oy = ob.y; }
    }

    if (player.x - player.r < walls.left || player.x + player.r > walls.right) { endGame(); return; }
    for (const ob of obstacles) {
      const dx = player.x - ob._ox, dy = player.y - ob._oy;
      if (dx*dx + dy*dy < (player.r + ob.r)**2) { endGame(); return; }
    }
    for (let i = bonuses.length - 1; i >= 0; i--) {
      const b = bonuses[i], dx = player.x - b.x, dy = player.y - b.y;
      if (dx*dx + dy*dy < (player.r + b.r)**2) {
        bonuses.splice(i,1); energy = 1;
        // Adım 1 aktifken bonus toplandığında ilerle
        if (tutStep === 1) advanceTut(2);
      }
    }

    // ── Tutorial zamanlayıcısı ──────────────────────────────
    if (tutStep >= 0 && tutStep <= 4) {
      tutTimer += dt;
      // Fade in: ilk 0.5s
      if (tutTimer < 0.5) tutAlpha = tutTimer / 0.5;
      else tutAlpha = 1;

      // Adım 0: 1.8s sonra fizik durdur, "TAP TO CHANGE DIR" mesajı göster
      if (tutStep === 0 && started && !tutPaused && tutTimer >= 1.8) {
        tutPaused = true;
        updateTutHud();
      }

      // Zamanlı adımlar için otomatik ilerleme
      if (tutStep === 1 && tutTimer > 3.5) advanceTut(2);
      if (tutStep === 2 && tutTimer > 3.5) advanceTut(3);
      if (tutStep === 3 && tutTimer > 5.5) advanceTut(4);
      if (tutStep === 4 && tutTimer > 5.5) { endTutorial(); }
    }
  }

  async function endGame() {
    // Ghost: bu oyunun trail'ini bir sonraki oyun için sakla
    ghostTrail = trail.map(p => ({ x: p.x, y: p.y, h: p.h ?? 120 }));
    running = false; started = false;
    best = Math.max(best, Math.floor(score));
    localStorage.setItem('arc_best', String(best));

    const sc  = Math.floor(score);
    const avc = AVATAR_COLORS[avatarIdx];

    goBestV.textContent = pad(best);
    // Önce ekranı aç — Firestore cevabını beklemeden
    showScene('over');

    // Geçici "yükleniyor" satırları
    rankRows.innerHTML = `<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,.3);font-size:6px;padding:12px 0">LOADING...</td></tr>`;

    // Skoru Firestore'a gönder (config yoksa no-op)
    await ARC_DB.submitScore(playerName, avatarIdx, sc);

    // Yeterli satır çek (player sıralamayı bulmak için)
    const topRows = await ARC_DB.getTopScores(50);

    if (topRows.length === 0) {
      // Firebase config yok → yerel fallback
      const r1 = Math.max(0, best + 1), r3 = Math.max(0, sc - 1);
      topRows.push(
        { name: 'NEXUS',    avatar: 0, score: r1 },
        { name: playerName, avatar: avatarIdx, score: sc },
        { name: 'BYTE',     avatar: 4, score: r3 },
      );
    }

    // Rank ata, oyuncuyu işaretle (aynı isim + aynı skor → ilk eşleşme)
    let markedYou = false;
    const ann = topRows.map((r, i) => {
      const isYou = !markedYou && r.name === playerName && r.score === sc;
      if (isYou) markedYou = true;
      return { ...r, rank: i, isYou };
    });

    // Oyuncu top-50 dışındaysa doğru pozisyona ekle
    if (!markedYou) {
      const ins = ann.findIndex(r => r.score < sc);
      const pe  = { name: playerName, avatar: avatarIdx, score: sc, isYou: true };
      if (ins === -1) {
        pe.rank = ann.length;
        ann.push(pe);
      } else {
        pe.rank = ins;
        ann.splice(ins, 0, pe);
        for (let j = ins + 1; j < ann.length; j++) ann[j].rank = j;
      }
    }

    const youIdx = ann.findIndex(r => r.isYou);

    // Gösterilecek 4 satır: #1 + bir üst + kendim + bir alt
    const showSet = new Set([0]);
    if (youIdx > 0)                      showSet.add(youIdx - 1);
    showSet.add(youIdx);
    if (youIdx + 1 < ann.length)         showSet.add(youIdx + 1);
    const showArr = [...showSet].sort((a, b) => a - b);

    // Satırları oluştur; boşluk varsa ··· ayırıcı
    let html = '';
    let prev = -1;
    for (const idx of showArr) {
      if (prev >= 0 && idx > prev + 1) {
        html += `<tr><td colspan="3" style="text-align:center;color:rgba(255,255,255,.22);font-size:8px;padding:3px 0;letter-spacing:2px">···</td></tr>`;
      }
      const r  = ann[idx];
      const rc = AVATAR_COLORS[r.avatar] ?? '#fff';
      const rankStr = String(r.rank + 1).padStart(3, '0') + '.';
      html += `<tr class="${r.isYou ? 'you' : ''}" ${r.isYou ? `style="color:${avc}"` : ''}>
        <td style="white-space:nowrap">${rankStr}</td>
        <td style="padding:0 8px">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${rc};vertical-align:middle;margin-right:4px"></span>${r.name}
        </td>
        <td style="text-align:right">${pad(r.score)}</td>
      </tr>`;
      prev = idx;
    }
    rankRows.innerHTML = html;
  }

  // Dinamik hane: 0-999 → 3 hane | 1000-999999 → 6 | 1000000+ → 9
  const pad = n => {
    const v = Math.max(0, Math.floor(n));
    if (v < 1000)    return String(v).padStart(3, '0');
    if (v < 1000000) return String(v).padStart(6, '0');
    return             String(v).padStart(9, '0');
  };

  // ── Main draw loop ────────────────────────────────────────
  let lastT = 0;
  function loop(ts) {
    const dt   = Math.min(.033, (ts - lastT) / 1000 || 0); lastT = ts;
    const time = ts / 1000;

    // BG canvas: grid + arcs (home/settings)
    bctx.clearRect(0, 0, W, H);
    drawGrid(bctx, scene === 'play' || scene === 'over' ? camY : time * 22, .13);
    if (scene === 'home' || scene === 'settings') { tickBgArcs(dt); drawBgArcs(bctx); }

    // Game canvas
    ctx.clearRect(0, 0, W, H);
    if (scene === 'play' || scene === 'over') {
      drawWalls(); drawGhostTrail(); drawObstacles(); drawBonuses();
      drawTrail(time); drawPlayer(); drawRipples();
      // Tutorial katmanı — her zaman oyun üzerine çiz
      if (scene === 'play') drawTutorial(time);
    }

    if (scene === 'play' && running) {
      step(dt); // step kendi içinde tutPaused kontrolü yapar
      hScore.textContent = pad(Math.floor(score));
      hBest.textContent  = pad(best);
      if (!tutPaused) refreshLB();
    }

    requestAnimationFrame(loop);
  }

  // ── Scene management ─────────────────────────────────────
  function showScene(s) {
    scene = s;
    profileSetupEl.classList.toggle('active', s === 'profile-setup');
    homeEl.classList.toggle('active',         s === 'home');
    settingsEl.classList.toggle('active',     s === 'settings');
    gameoverEl.classList.toggle('active',     s === 'over');
    hudEl.classList.toggle('active',          s === 'play');
    if (s === 'home') { homeBestV.textContent = pad(best); updateHomeDiff(); endTutorial(); }
    if (s !== 'play') tutHudEl.classList.remove('active');
  }

  // İlk açılışta profil oluşturma ekranını göster
  if (!localStorage.getItem('arc_name')) {
    showScene('profile-setup');
  } else {
    showScene('home');
  }

  // ── Tutorial HUD: SKIP butonu ──────────────────────────────
  document.getElementById('tut-skip-btn').addEventListener('click', () => {
    endTutorial();
  });

  // ── Reset Data ────────────────────────────────────────────
  document.getElementById('btn-reset').addEventListener('click', () => {
    ['arc_best','arc_diff_idx','arc_sfx','arc_mus','arc_fb','arc_firstplay','arc_name','arc_avatar'].forEach(k => localStorage.removeItem(k));
    best = 0; diffIdx = 1; firstPlay = true;
    playerName = ''; avatarIdx = 0;
    updateHomeDiff();
    homeBestV.textContent = pad(0);
    sfxSl.value = 80; musSl.value = 50;
    syncThumb(sfxSl, sfxTh); syncThumb(musSl, musTh);
    renderAvPicker(); applyProfile();
    const confirm = document.getElementById('reset-confirm');
    confirm.style.display = 'block';
    setTimeout(() => {
      confirm.style.display = 'none';
      showScene('profile-setup'); // isim sıfırlandı → yeniden oluştur
    }, 2000);
  });

  // ── Input ────────────────────────────────────────────────
  gc.addEventListener('pointerdown', e => {
    if (scene !== 'play') return;
    const rect = gc.getBoundingClientRect();
    const sx = (e.clientX - rect.left) * (W / rect.width);
    const sy = (e.clientY - rect.top)  * (H / rect.height);
    const radius = mapRadius(sx); // yatay: sol=küçük, sağ=büyük
    ripples.push({ x: sx, y: S2W(sy), t: performance.now() / 1000 });

    if (!started) {
      // İlk dokunuş: yay başlar
      beginArc(Math.random() < .5 ? -1 : 1, radius);
      started = true; running = true;
      if (tutStep === 0) updateTutHud();
    } else if (tutPaused && tutStep === 0) {
      // Tutorial freeze'den çıkış: yön değiştir, adım 1'e geç
      tutPaused = false;
      beginArc(-player.dir, radius);
      advanceTut(1);
    } else if (running) {
      beginArc(-player.dir, radius);
      // Adım 3: sol %35'e dokunulursa ilerle
      if (tutStep === 3 && sx < W * 0.35) advanceTut(4);
      // Adım 4: sağ %35'e dokunulursa ilerle
      else if (tutStep === 4 && sx > W * 0.65) advanceTut(5);
    }
  });
  gc.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  // ── Profil UI ─────────────────────────────────────────────
  renderAvPicker();
  applyProfile();

  // ── Settings UI ───────────────────────────────────────────
  function syncThumb(sl, th) {
    const pct = (sl.value - sl.min) / (sl.max - sl.min);
    th.style.left = `calc(${pct*100}% - 2.5px)`;
  }
  syncThumb(sfxSl, sfxTh); syncThumb(musSl, musTh);
  sfxSl.addEventListener('input', () => syncThumb(sfxSl, sfxTh));
  musSl.addEventListener('input', () => syncThumb(musSl, musTh));

  // Difficulty — home screen
  document.getElementById('hd-prev').addEventListener('click', () => { diffIdx = (diffIdx - 1 + DIFFS.length) % DIFFS.length; updateHomeDiff(); localStorage.setItem('arc_diff_idx', diffIdx); });
  document.getElementById('hd-next').addEventListener('click', () => { diffIdx = (diffIdx + 1) % DIFFS.length; updateHomeDiff(); localStorage.setItem('arc_diff_idx', diffIdx); });
  updateHomeDiff();

  const fbOn  = document.getElementById('fb-on');
  const fbOff = document.getElementById('fb-off');
  function setFeedback(v) {
    feedbackOn = v;
    fbOn.className  = 'tog-btn ' + (v  ? 'active-on'  : 'active-off');
    fbOff.className = 'tog-btn ' + (!v ? 'active-on'  : 'active-off');
  }
  fbOn.addEventListener('click',  () => setFeedback(true));
  fbOff.addEventListener('click', () => setFeedback(false));
  setFeedback(feedbackOn);

  // ── Nav buttons ───────────────────────────────────────────
  function startGame(withTutorial) {
    resetGame();
    showScene('play');
    if (withTutorial || firstPlay) {
      if (firstPlay) {
        firstPlay = false;
        localStorage.setItem('arc_firstplay', '0');
      }
      advanceTut(0); // in-game tutorial: adım 0'dan başlat
    }
  }

  document.getElementById('btn-start').addEventListener('click', () => startGame());
  document.getElementById('wrap-start').addEventListener('click', () => startGame());

  // Home alt bağlantılar
  document.getElementById('btn-tutorial-link').addEventListener('click', () => {
    startGame(true); // tutorial ile başlat
  });
  document.getElementById('btn-credits').addEventListener('click', () => {
    alert('ArcRise\nv1.0 — 2025\nDesign & Code: Buğra Sulukcu');
  });

  document.getElementById('btn-settings').addEventListener('click', () => showScene('settings'));

  document.getElementById('btn-back').addEventListener('click', () => {
    localStorage.setItem('arc_diff_idx', diffIdx);
    localStorage.setItem('arc_sfx', sfxSl.value);
    localStorage.setItem('arc_mus', musSl.value);
    localStorage.setItem('arc_fb', feedbackOn ? '1' : '0');
    showScene('home');
  });

  document.getElementById('btn-again').addEventListener('click', () => startGame());
  document.getElementById('wrap-again').addEventListener('click', () => startGame());
  document.getElementById('btn-menu').addEventListener('click', () => showScene('home'));

  // ── Boot ─────────────────────────────────────────────────
  initBgArcs();
  resetGame();
  applyProfile();
  // showScene is called by the profile-setup check above (or after ps-confirm)
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
